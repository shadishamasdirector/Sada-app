<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدى — أستوديو تدريب الصوت</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141019; --bg2:#1c1626; --card:#221c30; --card2:#2a2238;
    --gold:#FF5500; --gold-dim:#B34D1A; --rec:#D4453C;
    --text:#FFFFFF; --muted:#D8D0E4; --line:#382f47;
  }
  *{box-sizing:border-box}
  body{background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; margin:0;}
  button, input, textarea, select{ font:inherit; color:inherit; }
  button{ background:none; border:none; cursor:pointer; text-align:inherit; }
  .txt-muted{ color:var(--muted); }
  .txt-gold{ color:var(--gold); }
  .txt-rec{ color:var(--rec); }
  .bgc-gold{ background:var(--gold); }
  .bgc-card2{ background:var(--card2); }
  .navbar-bg{ background:var(--bg2); backdrop-filter:blur(10px); opacity:.98; }
  .bd-gold{ border-color:var(--gold); }
  .bd-line{ border-color:var(--line); }
  .ph-muted::placeholder{ color:var(--muted); }
  .app-maxw{ max-width:480px; }
  .accent-gold{ accent-color:var(--gold); }
  input, textarea{ color:var(--text); }
  .disp{font-family:'Cairo',sans-serif;}
  .font-700{font-weight:700 !important;}
  .font-800{font-weight:800 !important;}
  .font-900{font-weight:900 !important;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; background:linear-gradient(180deg,var(--bg2),var(--bg) 200px); position:relative; padding-bottom:88px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px;}
  .locked{filter:grayscale(0.8); opacity:0.5;}

  /* ===== Neumorphism ===== */
  .neu{
    border-radius:18px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 7px 7px 14px #0a0712, -7px -7px 14px #302548;
    transition: box-shadow .25s ease, transform .15s ease;
  }
  .neu-round{ border-radius:50%; }
  .neu-square{ border-radius:20px !important; }
  .neu-breath{ background:#E6540A; color:#fff; box-shadow:0 8px 18px -6px rgba(138,106,58,.45), inset 0 1px 0 rgba(255,255,255,.14) !important; }
  .neu-grammar{ background:#CC4400; color:#fff; box-shadow:0 8px 18px -6px rgba(166,124,53,.45), inset 0 1px 0 rgba(255,255,255,.14) !important; }
  .neu-perf{ background:#993300; color:#fff; box-shadow:0 8px 18px -6px rgba(110,82,40,.45), inset 0 1px 0 rgba(255,255,255,.14) !important; }
  .neu-general{ background:#661F00; color:#fff; box-shadow:0 8px 18px -6px rgba(92,69,32,.45), inset 0 1px 0 rgba(255,255,255,.14) !important; }
  .neu-community{ background:#E64A00; color:#fff; box-shadow:0 8px 20px -6px rgba(198,132,31,.55), inset 0 1px 0 rgba(255,255,255,.16) !important; }
  .neu-flat{ background:#221c30; }
  .neu-pressed{ background:#1c1727; box-shadow: inset 5px 5px 10px #0a0712, inset -5px -5px 10px #2c2240; }
  .neu-locked{ background:#1a1622; box-shadow: inset 4px 4px 8px #0a0712, inset -4px -4px 8px #241d33; opacity:.55; }
  .neu-active:active{ transform:scale(.94); }
  .neu-glow-gold{ box-shadow: 7px 7px 14px #0a0712, -5px -5px 12px #382b17, 0 0 20px rgba(255,85,0,.4); }
  .neu-gold{
    background:
      radial-gradient(120% 120% at 28% 22%, rgba(255,255,255,.5), transparent 38%),
      radial-gradient(95% 95% at 78% 80%, rgba(0,0,0,.4), transparent 48%),
      radial-gradient(70% 70% at 62% 40%, rgba(0,0,0,.18), transparent 55%),
      radial-gradient(140% 140% at 50% 30%, #FF9D5C, #FF5500 55%, #B93900 100%);
    color:#fff;
    box-shadow: inset -3px -3px 7px rgba(0,0,0,.4), inset 2px 2px 5px rgba(255,255,255,.28), 0 8px 18px -4px rgba(255,85,0,.55), 0 0 20px rgba(255,85,0,.35) !important;
  }
  .emboss-text{ color:#fff; text-shadow: 0 1.5px 1px rgba(0,0,0,.5), 0 -1px 0 rgba(255,255,255,.3); }

  /* ===== Editor / Timeline ===== */
  .tl-track{ background:var(--card2); border:1px solid var(--line); border-radius:12px; position:relative; height:56px; }
  .tl-lane{ position:relative; height:100%; width:100%; overflow:hidden; border-radius:12px; }
  .tl-ruler{ position:relative; height:18px; }
  .tl-tick{ position:absolute; top:0; font-size:9px; color:var(--muted); transform:translateX(50%); }
  .playhead{ position:absolute; top:0; bottom:0; width:2px; background:var(--rec); z-index:20; pointer-events:none; }
  .playhead:after{ content:''; position:absolute; top:-6px; right:-4px; width:10px; height:10px; background:var(--rec); border-radius:50%; }
  .clip{ position:absolute; top:6px; bottom:6px; border-radius:8px; cursor:grab; touch-action:none;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 2px, transparent 2px 6px); }
  .clip.selected{ outline:2px solid var(--gold); }
  .clip-orig{ background-color:#4a4260; }
  .clip-bed{ background-color:#2d6e6b; }
  .clip-orig2{ background:linear-gradient(180deg,#7a5a88,#563f66); }
  .clip-partner{ background:linear-gradient(180deg,#d9a441,#9a7424); }
  .clip-orig2 .wf-clip, .clip-partner .wf-clip{ position:absolute; inset:0; display:flex; align-items:center; gap:1.5px; padding:0 4px; overflow:hidden; }
  .clip-user{ background-color:#c4553f; }
  .track-muted .tl-lane{ opacity:.3; }
  .tbtn{ width:30px; height:30px; border-radius:9px; font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .tbtn.on{ background:var(--gold); color:#241705; }
  .tbtn.off{ background:var(--card2); color:var(--muted); border:1px solid var(--line); }

  .playhead-global{ position:absolute; top:18px; bottom:0; width:2px; background:linear-gradient(180deg,var(--gold),var(--rec)); z-index:30; pointer-events:none; box-shadow:0 0 8px rgba(255,85,0,.6); }
  .playhead-handle{ position:absolute; top:-13px; right:-15px; width:30px; height:30px; border-radius:50%; pointer-events:auto; cursor:grab; touch-action:none; display:flex; align-items:center; justify-content:center; }
  .playhead-handle:active{ cursor:grabbing; }
  .playhead-handle:after{ content:''; width:16px; height:16px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px rgba(255,85,0,.85), 0 0 0 5px rgba(255,85,0,.18); }
  .video-bar-handle{ position:absolute; top:50%; width:16px; height:16px; margin-top:-8px; margin-left:-8px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(255,85,0,.75), 0 0 0 4px rgba(0,0,0,.25); pointer-events:auto; touch-action:none; cursor:grab; }
  .vol-slider{ -webkit-appearance:none; appearance:none; height:4px; background:var(--card2); border-radius:99px; outline:none; }
  .vol-slider::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--gold); box-shadow:0 0 6px rgba(255,85,0,.65); cursor:pointer; }
  .vol-slider::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:var(--gold); border:none; box-shadow:0 0 6px rgba(255,85,0,.65); cursor:pointer; }
  .vol-slider::-moz-range-track{ height:4px; background:var(--card2); border-radius:99px; }
  .vol-track{ height:4px; background:var(--card2); border-radius:99px; cursor:pointer; touch-action:none; }
  .vol-track-fill{ position:absolute; top:0; left:0; height:100%; background:var(--gold); border-radius:99px; pointer-events:none; }
  .vol-handle{ position:absolute; top:50%; width:18px; height:18px; margin-top:-9px; margin-left:-9px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(255,85,0,.7); pointer-events:none; }
  .vol-track{ height:4px; background:var(--card2); border-radius:99px; cursor:pointer; touch-action:none; }
  .vol-track-fill{ position:absolute; top:0; left:0; height:100%; background:var(--gold); border-radius:99px; pointer-events:none; }
  .vol-handle{ position:absolute; top:50%; width:18px; height:18px; margin-top:-9px; margin-left:-9px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px rgba(255,85,0,.7); pointer-events:none; }
  .tl-grid{ position:absolute; inset:0; pointer-events:none; }
  .tl-gridline{ position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.05); }

  .wf-clip{ background-size:200% 100%; background-repeat:repeat-x; background-position:0 center; }
  .clip-orig .wf-clip, .clip-bed .wf-clip, .clip-user .wf-clip{ position:absolute; inset:0; display:flex; align-items:center; gap:1.5px; padding:0 4px; overflow:hidden; }
  .wf-bar{ width:2px; border-radius:1px; background:rgba(255,255,255,.55); flex-shrink:0; }
  .clip-orig{ background:linear-gradient(180deg,#5a5074,#413a58); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
  .clip-bed{ background:linear-gradient(180deg,#379490,#255e5c); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .clip-user{ background:linear-gradient(180deg,#e2694c,#b4432c); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 3px 10px rgba(180,67,44,.35); }
  .clip.selected{ outline:2px solid var(--gold); box-shadow:0 0 0 4px rgba(255,85,0,.2); }

  .track-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .icon-btn{ display:flex; align-items:center; justify-content:center; }
  .icon-btn svg{ width:18px; height:18px; filter: drop-shadow(0 1.5px 1.5px rgba(0,0,0,.35)); }
  .icon-btn svg [stroke]{ stroke-width:2.3 !important; }
  .icon-btn.icon-sm svg{ width:12px; height:12px; }
  .icon-btn.icon-lg svg{ width:29px; height:29px; }
  .icon-btn.icon-lg svg [stroke]{ stroke-width:1.9 !important; }

  /* ===== Auth Screen ===== */
  .field{ width:100%; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; font-size:14px; color:var(--text); outline:none; }
  .field::placeholder{ color:var(--muted); }
  .social-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px; font-size:13px; font-weight:700; }
  .social-btn svg{ width:19px; height:19px; }
  .auth-tab{ flex:1; text-align:center; padding:10px; border-radius:12px; font-size:13px; font-weight:800; }
  .auth-tab.active{ background:var(--gold); color:#2a1204; }
  .auth-tab.inactive{ color:var(--muted); }
  .gender-chip{ flex:1; text-align:center; padding:11px; border-radius:14px; border:1px solid var(--line); background:var(--card2); font-size:13px; font-weight:700; }
  .gender-chip.selected{ border-color:var(--gold); background:rgba(255,85,0,.12); color:var(--gold); }
  .divider{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:11px; }
  .divider:before, .divider:after{ content:''; flex:1; height:1px; background:var(--line); }
  .chk{ width:18px; height:18px; border-radius:6px; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; shrink:0; }
  .chk.on{ background:var(--gold); border-color:var(--gold); color:#2a1204; }

  /* ===== Light Theme ===== */
  body.theme-light{ --bg:#F3EEE4; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#F1EBDD; --text:#150F06; --muted:#3A2E1C; --line:#E5DBC5; }
  body.theme-light .neu-flat{ background:#F1EBDD; box-shadow:6px 6px 12px #D9CFB8, -6px -6px 12px #FFFFFF; }
  body.theme-light .neu-pressed{ background:#ECE4D2; box-shadow: inset 5px 5px 10px #D9CFB8, inset -5px -5px 10px #FFFFFF; }
  body.theme-light .neu-locked{ background:#E7DEC9; box-shadow: inset 3px 3px 6px #D9CFB8, inset -3px -3px 6px #FFFFFF; opacity:.55; }
  body.theme-light .neu{ box-shadow:6px 6px 12px #D9CFB8, -6px -6px 12px #FFFFFF; }
  body.theme-light .card{ box-shadow:0 2px 10px rgba(120,100,60,.08); }
  body.theme-light .ghostbtn{ box-shadow:0 1px 4px rgba(120,100,60,.06); }
  body.theme-light .neu-round{ border:1.5px solid rgba(255,85,0,.45); }

  /* ===== Certificate ===== */
  .cert-frame{ border:2px solid var(--gold); border-radius:20px; padding:26px 18px; text-align:center; position:relative; background:linear-gradient(160deg,var(--card),var(--card2)); }
  .cert-frame:before{ content:''; position:absolute; inset:8px; border:1px solid rgba(255,85,0,.35); border-radius:14px; pointer-events:none; }

  /* ===== Pricing ===== */
  .plan-card{ border-radius:20px; padding:18px; border:1.5px solid var(--line); background:var(--card); position:relative; }
  .plan-card.featured{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 10px 26px -8px rgba(255,85,0,.4); }
  .plan-badge{ position:absolute; top:-11px; right:16px; background:var(--gold); color:#2a1204; font-size:10px; font-weight:800; padding:3px 10px; border-radius:99px; }
  .ad-banner{ border:1px dashed var(--line); border-radius:14px; padding:12px; text-align:center; }
  .transport-primary svg{ width:24px; height:24px; }
  .goldbtn{background:linear-gradient(135deg,#FF8A4C,var(--gold)); color:#231a0d; font-weight:800; text-align:center;}
  .ghostbtn{background:var(--card2); border:1px solid var(--line); color:var(--text); text-align:center;}
  .wave{display:flex; align-items:center; gap:3px; height:22px;}
  .wave span{width:3px; background:var(--gold); border-radius:2px; animation:w 1.1s ease-in-out infinite;}
  .wave span:nth-child(1){height:8px; animation-delay:0s}
  .wave span:nth-child(2){height:18px; animation-delay:.1s}
  .wave span:nth-child(3){height:12px; animation-delay:.2s}
  .wave span:nth-child(4){height:20px; animation-delay:.3s}
  .wave span:nth-child(5){height:9px; animation-delay:.4s}
  @keyframes w{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}
  .recdot{width:9px;height:9px;border-radius:50%;background:var(--rec);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,69,60,.6)}70%{box-shadow:0 0 0 10px rgba(212,69,60,0)}100%{box-shadow:0 0 0 0 rgba(212,69,60,0)}}
  .navbtn.active{color:var(--gold)}
  .progress-ring{transition:stroke-dashoffset .5s ease}
  ::-webkit-scrollbar{display:none}

  /* ===== تكبير الخطوط ووضوح الألوان (v11) ===== */
  html{font-size:17px}
  .text-\[9px\],.text-\[10px\],.text-\[11px\]{font-size:13.5px !important}
  .text-\[12px\]{font-size:14.5px !important}
  .text-xs{font-size:15px !important; line-height:1.7 !important}
  .text-sm{font-size:17px !important; line-height:1.8 !important}
  .text-base{font-size:19px !important}
  .text-lg{font-size:21px !important}
  .text-xl{font-size:24px !important}
  .text-2xl{font-size:28px !important}
  .txt-muted{color:var(--muted) !important}
  .navbtn{font-size:13px !important}
  .field{font-size:16px} .social-btn,.auth-tab,.gender-chip{font-size:15px}
  .divider{font-size:13px} .plan-badge{font-size:12px}
  .tl-tick{font-size:11px}
  .leading-6{line-height:2 !important} .leading-7{line-height:2.1 !important}

  /* v12: عناوين أصغر قليلاً، والنص داخل البطاقات أكبر وأوضح */
  .text-sm.font-700,.text-sm.font-800,.text-xs.font-700,.text-xs.font-800{font-size:18px !important; line-height:1.6 !important}
  .text-base.font-700,.text-base.font-800,.text-lg{font-size:20px !important}
  [dir="rtl"].leading-6,[dir="rtl"].leading-7,p[dir="rtl"],div[dir="rtl"].text-xs,div[dir="rtl"].text-sm{
    font-size:16px !important; line-height:2.1 !important; color:#FFFFFF !important; font-weight:500}
  body.theme-light [dir="rtl"].leading-6,body.theme-light [dir="rtl"].leading-7,body.theme-light p[dir="rtl"],body.theme-light div[dir="rtl"].text-xs,body.theme-light div[dir="rtl"].text-sm{color:#120C03 !important}
</style>
</head>
<body dir="rtl">
<div id="app" dir="rtl"></div>

<script>
/* ============ البيانات ============ */
const GENERIC_EXERCISES = [
  {title:'تنفس الحجاب الحاجز', desc:'تمرين تحضيري عام على التنفس من الحجاب الحاجز، سيُستبدل بمحتوى مخصص لهذا اليوم قريباً.'},
  {title:'شهيق وزفير متحكّم به', desc:''},
  {title:'تمديد الزفير على مقاطع', desc:''},
  {title:'رجرجة الشفاه (Lip Trill)', desc:''},
  {title:'إحماء الفك واللسان', desc:''},
  {title:'الرنين الصوتي (Humming)', desc:''},
  {title:'مزامنة النفس مع الجملة', desc:''}
];
const BREATHING_DAYS = [
  { exercises: [
    {title:'التنفس مع العدّ إلى خمسة', desc:'شهيق من الأنف مع العدّ إلى خمسة، حبس النفس خمس عدّات، ثم زفير من الفم خمس عدّات. مع كل يوم يتكرر فيه التمرين، تُزاد مدة العدّ تدريجياً.'},
    {title:'زفير بصوت "بررررر" أو "ففففف" مع رجرجة الشفاه', desc:'أخذ النفس من الأنف وإخراجه من الفم مع إصدار صوت "بررررر" أو "ففففف" مع رجرجة الشفاه.'},
    {title:'التثاؤب بأقصى درجة', desc:'التثاؤب بأقصى اتساع ممكن، عدة مرات متتالية.'},
    {title:'حبس النفس وإخراجه بالأحرف', desc:'أخذ شهيق وحبس النفس، ثم إخراجه تدريجياً مع أحرف مثل: الثاء، الشين، السين، الفاء، الصاد... وهكذا.'},
    {title:'تحريك الفك السفلي يميناً ويساراً', desc:'تحريك الفك السفلي إلى الشمال واليمين بحركة منتظمة دون تشنج أو إرهاق، مع زيادة عدد المرات قليلاً كل مرة يُجرى فيها التمرين.'},
    {title:'تحريك الفك السفلي بشكل دائري', desc:'تحريك الفك السفلي بشكل دائري باتجاه عقارب الساعة عدة مرات، ثم بعكس اتجاه عقارب الساعة، بإيقاع منتظم.'},
    {title:'الانحناء مع الزفير الكامل', desc:'الجلوس بشكل مريح ومستوٍ، أخذ شهيق والعدّ إلى خمسة، حبسه خمساً، ثم إخراجه مع ثني الجسم للأمام حتى الأقصى لإخراج كامل النفس، مع إرجاع اليدين إلى الخلف كجناحي طير.'},
    {title:'طبقات الصوت الثلاث (السلم الموسيقي)', desc:'السلم الموسيقي عدة مرات صعوداً ونزولاً: دو ري مي فا صول لا سي دو، ثم سي لا صول فا مي ري دو. وأيضاً تقليد صوت سيارة الإسعاف (قرار وجواب).'}
  ]},
  { exercises: [
    {title:'البالون: نفخة أولى', desc:'أخذ شهيق من الأنف ونفخ البالون إلى أقصى درجة، ومراقبة حجمه لمقارنته بحجم البالون في المرات اللاحقة عندما يُعاد التمرين.'},
    {title:'البالون: ثلاث نفخات متتالية بلا تسريب هواء', desc:'أخذ شهيق عميق من الأنف والنفخ في البالون إلى أقصى درجة، وإغلاق البالون لعدم خروج الهواء منه، ثم أخذ نفس عميق من الأنف مرة أخرى والنفخ في البالون حتى ينقطع النفس. ثم مرة ثالثة بنفس الطريقة دون أن يخرج الهواء من البالون. راقب جيداً الحجم الذي وصل إليه البالون حتى تقارنه بالحجم الذي ستصل إليه في اليوم الذي ستعيد فيه هذا التمرين، لتعرف إن كنت تتقدم ودرجة التقدم.'},
    {title:'البالون: شهيق بالعدّ ثم نفخ', desc:'شهيق مع العدّ حتى خمسة، وحبس النفس خمسة، ثم زفير خمسة، وبعدها نفخ البالون إلى آخر النفس.'},
    {title:'تمرين القلم', desc:'وضع قلم بالعرض في الفم وقراءة عدة جمل.'},
    {title:'a.o.i.e.u.ou بطريقة متقطعة', desc:'نطق a.o.i.e.u.ou بطريقة متقطعة (كل حرف بشكل منفصل).'},
    {title:'a.o.i.e.u.ou بطريقة متواصلة', desc:'نطق a.o.i.e.u.ou بطريقة متواصلة (دفعة واحدة بلا انقطاع).'},
    {title:'اوووم مع العدّ', desc:'إصدار صوت "اوووم" ممدوداً مع العدّ.'},
    {title:'نص: تسجيل مع سماع ضجيج بالسماعة', desc:'احفظ هذا النص: "إِنَّ النَّجَاحَ لا يَأْتِي مِنْ فَراغٍ، بَلْ يَحْتاجُ إِلى صَبْرٍ وَعَمَلٍ مُسْتَمِرٍّ. فَمَنْ يَسْعَ إِلى هَدَفِهِ بِثَباتٍ، سَيَجِدُ أَنَّ كُلَّ خُطْوَةٍ تُقَرِّبُهُ مِنْ حُلْمِهِ. وَلا تَجْعَلِ الخَوْفَ مِنَ الفَشَلِ سَبَبًا لِلتَّراجُعِ، فَالتَّجْرِبَةُ أَفْضَلُ مِنَ النَّدَمِ." سجّله أول مرة بطريقة عادية. بعدها سجّله وأنت تسمع ملفاً صوتياً فيه ضجيج على سماعة الأذنين، وبينما تسمع هذا الضجيج سجّل النص. اسمع التسجيلين وقارن بينهما وشوف إذا في فرق. هدف التمرين تقوية التركيز على أداء النص دون التأثر بالمؤثرات الخارجية.'}
  ] },

    {title:'المصاصة: إطفاء الشمعة (٧٠ سم)', desc:'أخذ نفس وحبسه نفس مدة الشهيق، وإخراجه من المصاصة باتجاه الشمعة لإطفاء شعلتها، والمسافة ٧٠ سم.'},
    {title:'المصاصة: نفخ بطيء دون إطفاء الشمعة', desc:'أخذ شهيق وحبسه نفس المدة، وإخراجه من المصاصة ببطء نحو الشمعة دون أن تطفئها.'},
    {title:'غرغرة الماء وبلعه على دفعات', desc:'وضع كمية من الماء في الفم ورفع الرأس، والغرغرة بها، ثم بلعها على دفعات. في كل مرة يُعاد فيها التدريب، زد الوقت أي قسّم بلع الماء إلى كميات أقل ومرات أكثر.'},

    {title:'نص: تسجيل بعينين مغمضتين', desc:'خذ هذا النص المكوّن من ثلاثة أسطر: "إِنَّ النَّجَاحَ لا يَأْتِي مِنْ فَراغٍ، بَلْ يَحْتاجُ إِلى صَبْرٍ وَعَمَلٍ مُسْتَمِرٍّ. فَمَنْ يَسْعَ إِلى هَدَفِهِ بِثَباتٍ، سَيَجِدُ أَنَّ كُلَّ خُطْوَةٍ تُقَرِّبُهُ مِنْ حُلْمِهِ. وَلا تَجْعَلِ الخَوْفَ مِنَ الفَشَلِ سَبَبًا لِلتَّراجُعِ، فَالتَّجْرِبَةُ أَفْضَلُ مِنَ النَّدَمِ." احفظه وسجّله أول مرة بطريقة عادية، وبعدها أغمض عينيك وسجّله. اسمع التسجيلين وقارن بينهما وشوف إذا في فرق. هدف التمرين تقوية التركيز على أداء النص.'}

  { exercises: [

    {title:'الشمعة: إطفاء الشعلة من مسافة متزايدة', desc:'أخذ شهيق وحبسه نفس المدة، وإطفاء شعلة الشمعة. في كل مرة، يُبعِد المتدرب الشمعة عنه أكثر، بدءاً من ٣٠ سم إلى ٧٠ سم.'},

    {title:'نص: تسجيل بأذنين مغلقتين', desc:'خذ نصاً من ثلاثة أسطر، احفظه وسجّله أول مرة بطريقة عادية، وبعدها أغلق أذنيك وسجّله. اسمع التسجيلين وقارن بينهما وشوف إذا في فرق. هدف التمرين تقوية التركيز على أداء النص.'}

    {title:'تدوير اللسان داخل الفم', desc:'تدوير اللسان باتجاه عقارب الساعة على أجزاء الخدين والشفتين الداخلية عدة مرات، ثم بعكس اتجاه عقارب الساعة.'},
    {title:'نص: رحلة في أعماق اللغة', desc:'اقرأ نص "رحلة في أعماق اللغة" (نص طويل يحتوي كلمات ومصطلحات صعبة النطق كالاستثناء والاستقصاء والديناميكية والأنثروبولوجيا وغيرها، وجملاً تجمع حروفاً متقاربة المخارج كالضاد والظاء والصاد والسين والطاء والتاء). اقرأ الصفحة مرة ببطء، ومرة بسرعة متوسطة، ومرة بسرعة، على أن يبقى الأداء جميلاً والأحرف واضحة في المرات الثلاث. قِس الوقت في كل مرة واحتفظ به لمقارنته مع المرات اللاحقة التي سيُعاد فيها التمرين.'}

const GRAMMAR_UNITS = [   {t:'الترقيق والتفخيم (مقدمة)', d:'تفخيم الأصوات المرقّقة أو ترقيق الأصوات المفخّمة من أبرز مشاكل التقديم الإعلامي، بحيث يؤدي عدم معرفة المذيع أو مقدم البرامج بقواعد الترقيق والتفخيم إلى انقلابات صوتية قبيحة، فالباء (ب) حرف مرقّق يقوم البعض بتفخيمه خطأً عند مجاورته لألف المدّ أو لصوت مفخّم. تنقسم الأصوات العربية إلى ثلاثة أقسام: (١) المفخّمة دائماً وهي سبعة: خ ص ض غ ط ق ظ. (٢) ما له أحكام تفخيم وترقيق وهما صوتان فقط: ر، ل. (٣) وباقي الأصوات مرقّقة دائماً.', text:'اليابان، الصباح، الأسباب، الانقلابات، الجباية، الطلبات، ألمانيا.'},   {t:'درجات التفخيم الأربع', d:'بعض المعلقين يعرفون الأحرف المفخّمة لكنهم لا يعرفون أن التفخيم أربع درجات، وهذا يوقعهم في أخطاء فادحة بطريقة اللفظ. الدرجة الأولى (الأعلى): عندما يأتي الحرف المفخّم مفتوحاً وبعده ألف (خائف، صامتون، ضامنون، طائر، ظالمون، غاضبون، قاتل). الدرجة الثانية (أخف من الأولى): عندما لا يليه ألف ويكون مفتوحاً (خَرَقَ، صَرَحَ، ضَمَرَ، طَلَعَ، ظَهْر، غَمرة، قَبِلَ). الدرجة الثالثة (أخف من الثانية): الحرف المفخّم المضموم (خُروج، صُلب، ضُعف، طُول، ظُهر، غُفران، قُوة). الدرجة الرابعة (الأخف): الحرف المفخّم المكسور (خِدمة، صِدق، ضِياء، طِب، ظِلال، غِذاء، قِمة).', text:'خائف، خالد، صامتون، صابر، طارق، طائر، قاسم، قاتل — خَرَقَ، صَرَحَ، طَلَعَ — خُروج، صُلب، طُول — خِدمة، صِدق، طِب.'},   {t:'مفردات تدريبية للأحرف المفخّمة والمرقّقة', d:'أمثلة تدريبية على الأحرف المفخّمة: الخاء (آخرون، مخاوف، الانتخابات)، الصاد (الفصائل، مصابيح، اقتصاد)، الضاد (ضِمن، الأوضاع، رمضان)، الغين (غارة، صِغار، بغاء)، الطاء (قِطاع، بطاقات، إيطاليا)، القاف (مقاومة، قادة، ارتقاء)، الظاء (نظام، مظاهرات، انتظام). أما الأحرف المرقّقة فهي: أ ب ت ث ج ح د ذ ز س ش ع ف ك م ن هاء و ي، ولكل حرف منها أمثلة مماثلة مثل: الهمزة (أول، إجراءات)، الباء (ضباب، اليابان)، التاء (كتاب، تفاصيل)، الجيم (زجاج، مهرجان)، الحاء (صحاح، محاولة)، الدال (أضداد، الحدود)، الذال (آذان، مذيع)، الزاي (مزارع، وزراء)، السين (سارعت، انقسام)، الشين (مشاريع، انتشار)، العين (معايير، أضعاف)، الفاء (أطفال، دفاع)، الكاف (مكان، ذكاء)، الميم (أمام، ألمانيا)، النون (نار، قنابل)، الهاء (نهاية، ظهر)، الواو (صواريخ، أضواء)، الياء (سياج، اختيار).', text:'آخرون، مخاوف، الفصائل، مصابيح، ضِمن، الأوضاع، قِطاع، مقاومة، نظام، مظاهرات.'},   {t:'أحكام تفخيم الراء وترقيقها', d:'الراء تُرقَّق: (١) إذا كانت مكسورة. (٢) ساكنة وقبلها مكسور. (٣) ساكنة بسبب الوقف وقبلها ساكن قبله مكسور. الراء تُفخَّم: (١) إذا كانت مفتوحة. (٢) إذا كانت مضمومة. (٣) ساكنة وقبلها فتح. (٤) ساكنة وقبلها ضم. (٥) ساكنة وقبلها ساكن ما قبله مفتوح أو مضموم. (٦) ساكنة قبلها كسر عرضي غير أصلي. (٧) مسبوقة بكسرة وبعدها صوت مفخّم. يُلاحظ أن الراء تُفخَّم أو تُرقَّق تبعاً لأثر الحركة التي تسبقها: الضمة والفتحة تُعطيانها التفخيم، والكسرة تُعطيها الترقيق. ويختفي أثر الكسرة في ترقيق الراء عندما يأتي بعدها صوت مفخّم متبوع بألف يعزز ذلك التفخيم.', text:'أمرَ أميرُ الأمراءِ بحفرِ بئرٍ في الصحراءِ ليشربَ منهُ الفقراءُ فهل فخَّمْتَ أم رقَّقْتَ حرفَ الراء؟ فالراء تُفخَّم في كل كلمة هنا إلا في كلمة (بئر).'},   {t:'تفخيم اللام أو ترقيقها (لفظ الجلالة)', d:'أحكام تفخيم اللام أو ترقيقها مقصورة على لفظ الجلالة (الله) فقط؛ ففي سائر الكلام تكون اللام مرقّقة على الدوام. تُفخَّم لام لفظ الجلالة إذا سُبقت بفتحة أو ضمة (مثل: هذا عبدُ الله، ما شاءَ الله، سبحانَ الله)، وتُرقَّق إذا سُبقت بكسرة (مثل: بسمِ الله، من عبدِ الله، كفى بِالله). عدا هذه الحالة الوحيدة، فإن اللام صوت مرقّق لا يجوز تفخيمها، والكثير من المعلقين يقعون بهذا الخطأ.', text:'هذا عبدُ الله، ما شاءَ الله، سبحانَ الله — وبسمِ الله، من عبدِ الله، كفى بِالله.'},   {t:'نص تدريبي: (القاف)', d:'على المتدرب أن ينتبه إلى ترقيق السين (والتي إذا فُخِّمت صارت صاداً)، وإلى ترقيق العين في كلمة عاقبه، وإلى تفخيم الراء المفتوحة في رفيق وسرق.', text:'سَرقَ قاسِم قلماً مِن مَقلمةِ توفيق، فتعقَّبهُ شفيق وقَبضَ عليه، وقدَّمَهُ إلى رفيقِهِ، فعاقَبهُ على ذلك.'},   {t:'نص تدريبي: (الكاف)', d:'الانتباه إلى التاء في كلمة تنطق حيث إنها قد تُفخَّم خطأً فتُلفظ طاءً.', text:'كُلُّ كلمَةٍ تنطقُ بها كتابٌ مكتوبٌ عليكَ، فكُن كما كُنتَ كائناً في فطرتك.'},   {t:'نص تدريبي: (القاف والكاف)', d:'على الصاد ألا تُلفظ سيناً، والانتباه إلى مَخرجَي القاف والكاف.', text:'صديقُكَ مَن صَدَقكَ وصدَّقكَ، ورفيقُكَ مَن رافَقَكَ ورَفِقَ بك، فقُل كَلمَةَ صِدقٍ في ذلكَ الرفيق وتَرَفَق في قولِك.'},   {t:'نص تدريبي: (الطاء والقاف والكاف)', d:'عدم تفخيم الطاء يجعلها تاءً، وضرورة إخراج القاف والكاف من مخرجيهما.', text:'طَرقتُ البابَ حتّى كَلَّ مَتني فلَمّا كَلَّ مَتني كَلَّمَتني فقالت لي: أيا إسماعيلُ صبراً فقلتُ: أيا أُسما عيلَ صبري'},   {t:'نص تدريبي: (السين والزاي)', d:'على المتدرب التركيز على ألا يخرج صوت الزاي أو الثاء أو الصاد سيناً.', text:'سَلمَ سعيدٌ وزيرَ الثقافة رسَالةً ثريّة بمضْمُونِها، سَخِية بأسلوبِها، سَلسةً مُزدانةً بزوايا صِياغتها.'},   {t:'نص تدريبي: (الهاء والحاء والعين)', d:'هذه الأصوات حلقية، واجتماعها معاً يضع عضلات الحلق في اختبار.', text:'حَطَ هدهدٌ عاثرُ الحظِّ على فرعٍ عالٍ، وَهَبتْ ريحٌ عاتيةٌ هوجاء اقتلعتِ الشَّجَرةَ وقَطَّعتْ فروعَها، فراعَهُ ذلكَ وأقلعَ عالياً بَاحِثاً عنِ الهدوء.'},   {t:'نص تدريبي: (الزاي والذال)', d:'يجب ألا يُلفظ صوت الذال زاياً، مع تكرار صوت الزاي بالجملة. وفي نص إضافي عن التاء والطاء: عند تفخيم التاء تخرج طاءً، وبالعكس عند ترقيق الطاء.', text:'زعمَ الزرزورُ أنَّ ذِئباً زارهُ أثناءَ زيارةِ زرافةٍ وذبابةً عندَهُ، وفي ذُروَةِ الحديثِ نقَدَ ذرورَ الذُّرة.<br><br>ملحق تدريبي: تكونُ التُّربةُ طريةً عندَما تهطُلُ الأمطارُ بطريقَةٍ غزيرةٍ وتُبَلِلُ الطريقَ. كانَ الطيارونَ الأوائلُ تحتَ رحمةِ التّياراتِ والمطباتِ الهوائية لكنّهُم تحكَّموا بالانطلاقِ والهبوط.'},   {t:'نص تدريبي: (الظاء والضاد)', d:'يخطئ كثيرون فيصدرون صوت الظاء بين الزاي والظاء أو يخرج زاي مفخّمة، وقد يلتبس صوت الضاد بالظاء.', text:'لدى ظريفَةَ ظبيٌ ظريفٌ ضاعَ في ضَيعَةٍ بعدَ ان ضَلَّ طريقَه، وظلَّ يمشي باتجاهِ الظِلالِ ظناً منهُ بأنَّ الظَرِبانَ الذي يتبعُه سيأخُذُهُ إلى ظريفة.'},   {t:'نص تدريبي: (الجيم والزاي)', d:'الجيم صوت قمري لذا يجب التنبه على إظهار لام التعريف وعدم تضعيف الجيم.', text:'الجمَلُ زعيمُ حيوانَاتِ البادية والزرافةُ اجملُ حيوانَاتِ السُّهول، وعلى اسْم الجِمالِ سُمِيَ الجمال، والجمَالُ في الجبالِ الشَّجّرية زينةُ الارضِ حيثُ تُحِبُ الزرازيرُ أنْ تُزقزقَ بينَ الاغصَانِ وخَلفَ الجُذوع.'},   {t:'الأحرف الشمسية', d:'الأحرف الشمسية هي التي لا تُلفظ معها لام التعريف (ال)، وهي أربعة عشر صوتاً: ت ث د ذ ر ز س ش ص ض ط ظ ن ل. طريقة التدرب: أ + صوت ساكن + صوت متحرك مع باقي الكلمة (مثال: التوافق = اتْ توافُق).', text:'التوافق، الثورة، الدفاع، الذرة، الرياضة، الزكاة، السعادة، الشمع، الصحة، الضرورة، الطريق، الظفر، الليل، النقاء.'},   {t:'الأحرف القمرية', d:'الأحرف القمرية هي التي تُلفظ معها لام التعريف (ال) بوضوح، وهي أيضاً أربعة عشر حرفاً: ا ب غ ح ج ك و خ ف ع ق ي م ه، وتُختصر بجملة: ابغِ حجّك وخِف عقيمه. تُقرأ بصيغة (ال + الكلمة كما هي)، مثل: الأسد = الْ أسد.', text:'الأسد، الأحمد، الإخلاص، البائع، الجميل، الحقيقة، الخيارات، العودة، الغربة، الفوز، القوة، الكرامة، المدرسة، الهدهد، الوزارة، اليمين.'},   {t:'همزة الوصل والقطع والمد', d:'همزة القطع هي الهمزة التي يجب أن تُلفظ دائماً، ونميّزها بوجود (ء) صغيرة أعلاها أو تحتها إذا كانت مكسورة. همزة الوصل تأتي في بداية الكلمة وتسقط عند الوصل بما قبلها، لكنها تُلفظ إذا جاءت في بداية الكلام ولم يسبقها شيء، ونلفظ الهمزة حينها في البداية وكأنها همزة قطع. همزة المد تُميَّز بوجود مدة بهذا الشكل (~) وتعني همزتين مدغمتين، فتُمد بطول همزتين، وتأتي في أول الكلام أو منتصفه.', text:'أنت الذي أحبه. الذي أحبه رحل، لا نقول لذي أحبه رحل، بل الذي أحبه رحل.'},   {t:'القلقلة', d:'ليس المطلوب إتقان القلقلة بنفس مستوى التجويد القرآني، لكنها ضرورية في الأصوات المتقلقلة حتى تخرج مفهومة وواضحة دون تآكل في الحرف أو تشوّه. أصوات القلقلة خمسة: ق ط ب ج د.', text:'سَرقَ، حَقّ، إفراط، اضطراب، احباب، انقلاب، إخراج، إفراج، مهد، اتحاد.'},   {t:'الصفير', d:'حروف الصفير هي: ز س ص، سُميت بذلك لأنها تصدر ما يشبه الصفير عند التلفظ بها. يجب التنبه جيداً عند التلفظ بهذه الأصوات خصوصاً لدى التسجيل في الاستوديو، لأن بعض الأشخاص بسبب اصطفاف الأسنان تخرج عندهم هذه الأحرف بطريقة نافرة، فيجب تخفيفها وتلطيفها كي لا تؤثر على جودة التسجيل.', text:'زوابع، مزارع، أزيز، هسيس، أقواس، سلاسل، أقاصيص، مصارف، صرصرة.'},   {t:'الاستطالة والتفشي', d:'الاستطالة: الحرف الوحيد في اللغة العربية الذي يمتاز بها هو حرف الضاد (ض). التفشي: خاص بحرف الشين، ويجب أن تلتقي الأسنان السفلى بالعليا كي يتفشى الحرف بشكل صحيح.', text:'أمراض، ضمائر، ضرير — مشوار، شاش، اعشاش، احراش، فراشات.'},   {t:'علامات الترقيم', d:'يوجد عدة علامات ترقيم، ولكن سنأخذ فقط ما يفيدنا في الأداء.<br><br> علامة التعجب (!) تأتي بعد كل ما يدل على انفعال وتأثر: في التعجب: (ما أجمل الجلوس في المنزل!). في الترجي: (يا ليتك تعطيني هذا الكتاب!). في التأسف والحسرة: (أسفي على الشباب الذي ضاع!). في المدح: (أنت أخي الذي لم تلده أمي!). في القدح والذم: (تباً لهذا الرجل!).<br><br> علامة الاستفهام (؟): (أين سافرت هذه السنة؟) (أنهيت مشاهدة التلفاز؟) (ذهب والدك إلى العمل؟) (هل تريد أن تأتي معي؟)<br><br> النقطة (.): توضع في نهاية كل جملة تامة لا تدل على تعجب أو استفهام، وفي نهاية كل فقرة.<br><br> الفاصلة أو الشولة (،): توضع في المكان الذي يتطلب سكوتاً قصيراً، وتفصل أيضاً بين الكلام السابق واللاحق. من أشهر أماكنها: بين الجمل القصيرة التامة (يستيقظ والدي صباحاً، يتناول القهوة، ثم يرتدي ثيابه ويذهب إلى العمل)، بعد المنادى (يا بني، جهز نفسك لنخرج في رحلةٍ غداً صباحاً)، وبعد المعطوفات الدالة على التقسيم (في السنة إثنا عشر شهراً: كانون الثاني، وشباط، وآذار، الخ...).<br><br> النقطتان توضعان (:) بعد فعل القول أو ما يعطي معناه، مثلاً: (قال الملك: لا أريد أن أرى أحداً منكم على الإطلاق، سألته: حتى أنا؟ فأجاب: حتى أنت.) وعند التفسير والشرح والتفصيل: (الأرقام هي: واحد، اثنان، ثلاثة.......)', text:'يستيقظ والدي صباحاً، يتناول القهوة، ثم يرتدي ثيابه ويذهب إلى العمل. ما أجمل الجلوس في المنزل! هل تريد أن تأتي معي؟ قال الملك: لا أريد أن أرى أحداً على الإطلاق.'},   {t:'التنغيم والنبر', d:'التنغيم: اللحن البسيط الذي ننغّم فيه الكلام لنوضح ماذا نقصد فيه، مثلاً كلمة (طيب): إذا قال لك صديقك: هل تدرس معي؟ وأجبته بكلمة: طيب (هنا أتت بمعنى موافق). إذا أساء لك أحدهم وقلت له طيب (تأتي هنا بمعنى سترى ماذا سأفعل بك، وكأنها تهديد). أما إذا سألك أحدهم: ما رأيك بالطعام، وقلت له: طيب (أتت هنا بمعنى لذيذ). كيف وجدت صديقك الجديد، وأجبت: طيب (أتت هنا بمعنى طيب القلب).<br><br> ومثال آخر: (شاركتَ في أول يوم من المهرجان وغبتَ عن الثاني؟) بصيغة سؤال، أو (شاركتَ في أول يوم من المهرجان وغبتَ عن الثاني!) بصيغة تعجب، أو (شاركتَ في أول يوم من المهرجان وغبتَ عن الثاني.) بمعنى: آه، لقد فهمت.<br><br> النبر: هو قوة زائدة تدخل على الأحرف لتوضيح المعنى المقصود ولتجميل الأداء وتلوينه، مثل: (مسسسستحيل) للتأكيد على الرفض، (مستحيل) بمعنى أنت تمزح، (مستحيييييل) بمعنى ما هذا الكلام.', text:'شاركتَ في أول يوم من المهرجان وغبتَ عن الثاني؟ شاركتَ في أول يوم من المهرجان وغبتَ عن الثاني! شاركتَ في أول يوم من المهرجان وغبتَ عن الثاني.'},   {t:'الوقف والتقطيع والوصل والفصل', d:'ما يحكم الفصل والتقطيع والوصل والوقف هو المعنى الذي نريد إيصاله، مثلاً: إذا قال لك أحدهم هل تذهب للعمل معي؟ وأجبته بهذه الطريقة: (لا، عافاك الله) تعني لن أذهب وأعطاك الله العافية. أما إذا وصلتها هكذا: (لاعافاك الله) فوكأنك تدعو له بعدم العافية.<br><br> من الأخطاء الشائعة في الوقف أن المعلّق أو المؤدي يقف على كلمة ويُبقي آخرها محرّكاً، في حين أنه يجب أن نُسَكِّن عند الوقوف، وهذا الأمر يقبّح الأداء، مثلاً: (كيف تذهب إلى السوقِ في هذا الوقت؟) إذا قلناها (كيف تذهب إلى السوقِ / في هذا الوقت؟) نقبّح الأداء، لذا من الأفضل أن نقولها: (كيف تذهب إلى السوقْ / في هذا الوقت؟)', text:'لا، عافاك الله. كيف تذهب إلى السوقْ / في هذا الوقت؟'} ];

  {t:'الشعر', d:'عند العرب، كان الشعراء يتبارزون في سوق عكاظ في الشعر، يتبارون في من يأتي بصورة شعرية جديدة أو كلمة لم تُستعمل من قبل بهذه الطريقة. لذا ما كان يحكم الإلقاء هو الوزن والإيقاع والقافية، والأهم: الصورة الشعرية الجديدة، والكلمة المفتاحية، والإحساس.<br><br>فعندما يعيدون شطراً في الإلقاء، لا يعيدونه كما نفعل نحن أحياناً من دون هدف لمجرد أننا تعوّدنا هكذا على إلقاء الشعر. كانوا يعيدون أحد الأبيات لأن فيه صورة شعرية جديدة يريدون تسليط الضوء عليها، أو تركيبة يصعب فهمها من المرة الأولى، أو كلمة جديدة لم تكن مستعملة من قبل بهذا الشكل. فالإعادة ليست مجرد تكرار، بل وسيلة لتسليط الضوء على فكرة جديدة أو كلمة جديدة أو شيء مميز في البيت الشعري.<br><br>لذا ما يحدد الأداء هو إيقاع ووزن الشعر، والمعنى الموجود فيه، والإحساس، وما نريد أن نبرزه — أي الكلمة المفتاحية والفكرة المميزة والأساسية.', mode:'record', echo:true,
   text:'جَاءَتْ مُعَذِّبَتِي فِي غَيْهَبِ الغَسَقِ،<br>كَأنَّهَا الكَوْكَبُ الدُرِيُّ فِي الأُفُقِ.<br>فَقُلْتُ نَوَّرْتِنِي يَا خَيْرَ زَائِرَةٍ،<br>أمَا خَشِيتِ مِنَ الحُرَّاسِ فِي الطُّرُقِ.<br>فَجَاوَبَتْنِي وَ دَمْعُ العَيْنِ يَسْبِقُهَا،<br>مَنْ يَرْكَبِ البَحْرَ لا يَخْشَى مِنَ الغَرَقِ.'},

     {key:'rules', label:'القواعد', type:'text', body:'أهمّ قواعد أداء الأخبار التلفزيونية ليست أن يكون الصوت «فخمًا» أو مرتفعًا؛ بل أن يكون واضحًا، موثوقًا، متزنًا، ومسيطرًا على المعنى.<br><br><b>1. الفهم قبل الأداء</b><br>المذيع يجب أن يفهم الخبر قبل قراءته: من؟ ماذا حدث؟ أين؟ متى؟ لماذا؟ ما النتيجة؟ إذا لم يفهم المذيع المعنى، ستصبح النبرة آلية حتى لو كان النطق ممتازاً.<br><br><b>2. لا تقرأ الكلمات؛ اقرأ المعنى</b><br>هذه من أهم القواعد. لا تجعل كل الكلمات بالدرجة نفسها من الأهمية، بل حدّد الكلمات المفتاحية واجعلها تحمل المعنى. مثال: «أعْلَنَتِ الحُكُومَةُ اليومَ خُطَّةً جَدِيدَةً لِدَعْمِ القِطَاعِ الصِّنَاعِيِّ» — الثقل يكون على «أعلنت الحكومة» و«خطة جديدة»، وليس على كل كلمة.<br><br><b>3. النبرة الإخبارية = ثقة لا انفعال</b><br>الصوت يجب أن يوحي: (أنا أنقل إليك معلومة موثوقة) وليس: (أنا أحاول إقناعك بأن هذا الخبر مهم!). لذلك تجنّب: المبالغة، الصراخ، الحزن المصطنع، الحماس الزائد، والتمثيل الدرامي.<br><br><b>4. السرعة ليست ثابتة</b><br>لا تقرأ النشرة كلها بسرعة واحدة. العنوان: أسرع قليلاً وأكثر حيوية. التفاصيل: سرعة متوسطة. المعلومة المهمة: أبطئ قليلاً. الأرقام والأسماء: أبطئ بوضوح. الانتقال بين الأخبار: وقفة قصيرة.<br><br><b>5. الوقفات جزء من المعنى</b><br>الوقفة ليست لأنك تحتاج إلى التنفس فقط. مثلاً: «أَعْلَنَ رَئِيسُ الحُكُومَةِ، (وقف) حُزْمَةً جَدِيدَةً مِنَ الإِجْرَاءَاتِ...» — الوقفة تجعل المستمع مستعداً للمعلومة التالية.<br><br><b>6. الأرقام تحتاج معاملة خاصة</b><br>الأرقام من أكثر الأشياء التي تكشف ضعف المذيع. مثلاً «مِئَةٌ وَخَمْسَةٌ وَثَلَاثُونَ مِلْيُونَ دُولَارٍ» لا تُرمى بسرعة؛ قسّم الرقم ذهنياً إلى وحدات، وأعطه وضوحاً أكبر من الكلمات المحيطة به.<br><br><b>7. أسماء الأشخاص والأماكن</b><br>قبل التسجيل يجب معرفة النطق الصحيح للأسماء الأجنبية والعربية، ولا تجعل الاسم يبدو وكأنه كلمة عابرة. مثلاً «أَنْطُونْيُو غُوتِيرِيش» يجب أن يكون واضحاً ومستقراً، خصوصاً في أول مرة يرد فيها الاسم.<br><br><b>8. نهاية الجملة الإخبارية</b><br>لا تجعل كل جملة تنتهي بنغمة صاعدة، لأن ذلك يعطي انطباعاً بأن المذيع يسأل سؤالاً. في الجمل الخبرية المكتملة، غالباً يكون هناك هبوط نغمي محسوب في النهاية.<br><br><b>9. بداية الخبر أهم من بقية الخبر</b><br>أول جملة يجب أن تدخل مباشرة إلى المعلومة. بدل أن تبدأ بنبرة طويلة ومسرحية، ابدأ بثبات: «أَعْلَنَتِ الحُكُومَةُ اليَوْمَ حُزْمَةً جَدِيدَةً مِنَ الإِجْرَاءَاتِ الاقْتِصَادِيَّةِ» ثم أعطِ التفاصيل.<br><br><b>10. الانتقال بين الأخبار</b><br>لا تنتقل من خبر سياسي إلى خبر إنساني بنفس الطاقة الصوتية. خبر سياسي ← اقتصادي: انتقال هادئ ومحايد. خبر عاجل ← عادي: خفّض الطاقة تدريجياً. خبر مأساوي ← عادي: لا تنتقل مباشرة بابتسامة أو حماس صوتي.<br><br><b>11. العاجل له أسلوب مختلف</b><br>الخبر العاجل يحتاج: سرعة أعلى قليلاً، تركيزاً أكبر، وقفات أقل، نبرة أكثر حزماً — لكن ليس صراخاً.<br><br><b>12. المراسل الميداني ليس مذيع الاستوديو</b><br>المذيع: هادئ، مسيطر، واضح. المراسل: أكثر حيوية وطبيعية، ويشعر المستمع أنه موجود في المكان، لكن يجب ألا يتحول إلى ممثل.<br><br><b>13. مراسل القصر الجمهوري أو مجلس النواب</b><br>هذا النوع تحديداً يحتاج إلى نبرة رسمية رصينة أكثر من المراسل الموجود في الشارع — يجب أن تشعر أن المراسل ينقل معلومات سياسية من موقع رسمي، وليس يقدم تقريراً تلفزيونياً ترفيهياً.<br><br><b>14. التنفس</b><br>التنفس يجب أن يكون صامتاً قدر الإمكان، قبل الجملة أو المجموعة المعنوية، وليس بعد نفاد الهواء. خطأ شائع: يبدأ المذيع الجملة بطاقة عالية، ينفد الهواء، يضعف آخر الجملة. الأفضل أن تخفف الطاقة قليلاً في البداية حتى تحافظ على قوتها حتى النهاية.<br><br><b>15. لا تبتلع الحركات</b><br>خصوصاً في العربية الفصحى. مثلاً «أَعْلَنَتِ الحُكُومَةُ» يجب أن تكون الحركات والنهايات واضحة، لكن من دون مبالغة مسرحية.<br><br><b>قاعدة ذهبية للتدريب:</b> وضوح + معنى + ثقة + اقتصاد في الانفعال + توقيت = أداء إخباري محترف.<br><br>لا يُنصح بتدريب الأخبار على أساس «الصوت العميق = مذيع محترف». هذه فكرة شائعة لكنها خاطئة؛ الصوت العميق قد يساعد في بعض أنواع الأخبار، لكن التحكم، والوضوح، والتلوين المعنوي، والوقفات أهمّ بكثير من طبقة الصوت نفسها.'},
     {key:'examples', label:'الأمثلة', type:'text', body:'أمثلة توضيحية من قواعد أداء الأخبار:<br><br><b>تحديد الكلمات المفتاحية (قاعدة 2):</b><br>«أعْلَنَتِ الحُكُومَةُ اليومَ خُطَّةً جَدِيدَةً لِدَعْمِ القِطَاعِ الصِّنَاعِيِّ» — الثقل على «أعلنت الحكومة» و«خطة جديدة».<br><br><b>الوقفة كجزء من المعنى (قاعدة 5):</b><br>«أَعْلَنَ رَئِيسُ الحُكُومَةِ، (وقف) حُزْمَةً جَدِيدَةً مِنَ الإِجْرَاءَاتِ...»<br><br><b>معاملة الأرقام (قاعدة 6):</b><br>«مِئَةٌ وَخَمْسَةٌ وَثَلَاثُونَ مِلْيُونَ دُولَارٍ» — تُقسَّم ذهنياً ولا تُرمى بسرعة.<br><br><b>أسماء الأشخاص (قاعدة 7):</b><br>«أَنْطُونْيُو غُوتِيرِيش» — يُنطق بوضوح واستقرار، خصوصاً أول مرة يرد فيها.<br><br><b>بداية الخبر المباشرة (قاعدة 9):</b><br>«أَعْلَنَتِ الحُكُومَةُ اليَوْمَ حُزْمَةً جَدِيدَةً مِنَ الإِجْرَاءَاتِ الاقْتِصَادِيَّةِ» ثم تأتي التفاصيل بعدها.'},
     {key:'intro', label:'المقدمة', type:'record', text:'مَسَاءُ الخَيْرِ. مَرْحَبًا بِكُمْ فِي نَشْرَتِنَا الإِخْبَارِيَّةِ، حَيْثُ نُوَاكِبُ مَعَكُمْ أَبْرَزَ الأَحْدَاثِ وَالتَّطَوُّرَاتِ، وَنَقْرَأُ مَعَكُمْ مَشْهَدًا يَوْمِيًّا يَحْمِلُ الكَثِيرَ مِنَ المَلَفَّاتِ السِّيَاسِيَّةِ وَالِاقْتِصَادِيَّةِ وَالمَعِيشِيَّةِ.<br><br>فِي السِّيَاسَةِ، الأَنْظَارُ تَتَّجِهُ إِلَى مَقَرِّ الحُكُومَةِ، حَيْثُ عُقِدَ اجْتِمَاعٌ لِمُتَابَعَةِ مَجْمُوعَةٍ مِنَ المَلَفَّاتِ الَّتِي تَتَّصِلُ بِحَيَاةِ المُوَاطِنِينَ مُبَاشَرَةً.<br><br>اجْتِمَاعٌ طَالَتْ مُدَّتُهُ، وَخَلُصَ إِلَى جُمْلَةٍ مِنَ القَرَارَاتِ وَالتَّوْجِيهَاتِ، فِي وَقْتٍ تَتَزَايَدُ فِيهِ التَّحَدِّيَاتُ الِاقْتِصَادِيَّةُ وَالخِدْمِيَّةُ.<br><br>مِنْ أَمَامِ مَقَرِّ الحُكُومَةِ، مُرَاسِلُنَا يَضَعُنَا فِي صُورَةِ مَا جَرَى، وَيَكْشِفُ أَبْرَزَ المَوَاقِفِ وَالقَرَارَاتِ الَّتِي خَرَجَ بِهَا الِاجْتِمَاعُ.<br><br>وَفِي مَجْلِسِ النُّوَّابِ، جَلْسَةٌ جَدِيدَةٌ عَلَى جَدْوَلِ الأَعْمَالِ، وَنِقَاشٌ يَتَّسِعُ حَوْلَ مَشْرُوعِ قَانُونٍ يَهْدِفُ إِلَى تَنْشِيطِ الِاسْتِثْمَارِ وَدَعْمِ الشَّرِكَاتِ النَّاشِئَةِ.<br><br>بَيْنَ مُؤَيِّدٍ يَرَى فِي المَشْرُوعِ خُطْوَةً نَحْوَ تَحْفِيزِ الِاقْتِصَادِ، وَمُتَحَفِّظٍ يَطْلُبُ ضَمَانَاتٍ أَكْبَرَ لِحِمَايَةِ الشَّرِكَاتِ الصَّغِيرَةِ وَتَأْمِينِ فُرَصٍ مُتَكَافِئَةٍ لِلْمُسْتَفِيدِينَ.<br><br>وَمِنْ قُبَّةِ البَرْلَمَانِ، نَقْلٌ مُبَاشِرٌ وَتَفَاصِيلُ الجَلْسَةِ مَعَ مُرَاسِلِنَا.<br><br>وَاقْتِصَادِيًّا، أَرْقَامٌ جَدِيدَةٌ تَكْشِفُ تَحَرُّكًا مُتَسَارِعًا فِي قِطَاعِ الطَّاقَةِ المُتَجَدِّدَةِ، وَشَرِكَاتٌ تُعْلِنُ عَنْ مَشَارِيعَ جَدِيدَةٍ فِي مَجَالِ الطَّاقَةِ الشَّمْسِيَّةِ وَتَخْزِينِ الكَهْرَبَاءِ.<br><br>فَمَا الَّذِي يَعْنِيهِ هَذَا التَّوَجُّهُ لِلمُوَاطِنِ؟ وَهَلْ يُمْكِنُ لِهَذِهِ المَشَارِيعِ أَنْ تُسَاهِمَ فِي خَفْضِ تَكْلِفَةِ الطَّاقَةِ وَتَأْمِينِ مَصَادِرَ أَكْثَرَ اسْتِقْرَارًا؟<br><br>نُجِيبُ عَنْ هَذِهِ الأَسْئِلَةِ فِي تَقْرِيرٍ خَاصٍّ، وَنَسْتَعْرِضُ أَبْرَزَ الأَرْقَامِ وَالمَعْطَيَاتِ.<br><br>وَفِي المَلَفِّ المَعِيشِيِّ، لَا تَزَالُ أَزْمَةُ المِيَاهِ فِي صَدَارَةِ اهْتِمَامِ المُوَاطِنِينَ، مَعَ اسْتِمْرَارِ العَمَلِ عَلَى خُطَّةٍ جَدِيدَةٍ لِتَحْدِيثِ شَبَكَاتِ التَّوْزِيعِ وَالحَدِّ مِنَ الهَدْرِ وَالتَّسَرُّبِ.<br><br>خُطَّةٌ تَعِدُ السُّلُطَاتُ بِأَنْ تَكُونَ بَدَايَةً لِمَرْحَلَةٍ جَدِيدَةٍ فِي إِدَارَةِ هَذَا المَرْفَقِ الحَيَوِيِّ، فِي حِينِ يَبْقَى السُّؤَالُ الأَسَاسِيُّ: مَتَى سَيَلْمَسُ المُوَاطِنُ نَتَائِجَ هَذِهِ الخُطَّةِ؟<br><br>وَفِي التَّعْلِيمِ، خُطْوَةٌ جَدِيدَةٌ نَحْوَ إِدْخَالِ أَدَوَاتِ الذَّكَاءِ الِاصْطِنَاعِيِّ وَالتِّقْنِيَاتِ الرَّقْمِيَّةِ إِلَى الصُّفُوفِ الدِّرَاسِيَّةِ.<br><br>تَجْرِبَةٌ تَفْتَحُ البَابَ أَمَامَ أَسْئِلَةٍ كَثِيرَةٍ حَوْلَ مُسْتَقْبَلِ التَّعْلِيمِ، وَدَوْرِ المُعَلِّمِ، وَكَيْفِيَّةِ اسْتِفَادَةِ الطُّلَّابِ مِنْ هَذِهِ التَّقْنِيَاتِ مِنْ دُونِ أَنْ تَحُلَّ مَحَلَّ التَّفَاعُلِ الإِنْسَانِيِّ دَاخِلَ الفَصْلِ.<br><br>نَقْتَرِبُ مِنْ هَذِهِ التَّجْرِبَةِ فِي تَقْرِيرٍ خَاصٍّ، وَنَسْتَمِعُ إِلَى رَأْيِ المُعَلِّمِينَ وَالطُّلَّابِ.<br><br>وَبِعِيدًا عَنْ المَلَفَّاتِ الدَّاخِلِيَّةِ، نَتَابَعُ مَعَكُمْ آخِرَ التَّطَوُّرَاتِ فِي الخَارِجِ.<br><br>مَعْرِضٌ دَوْلِيٌّ لِلتِّكْنُولُوجْيَا يَجْمَعُ شَرِكَاتٍ مِنْ مُخْتَلِفِ أَنْحَاءِ العَالَمِ، وَيَعْرِضُ أَحْدَثَ الِابْتِكَارَاتِ فِي مَجَالَاتِ الذَّكَاءِ الِاصْطِنَاعِيِّ وَالطَّاقَةِ النَّظِيفَةِ وَالسَّيَّارَاتِ الكَهْرَبَائِيَّةِ.<br><br>مُرَاسِلُنَا مِنْ هُنَاكَ يَنْقُلُ لَنَا أَجْوَاءَ المَعْرِضِ، وَيُطْلِعُنَا عَلَى أَبْرَزِ التَّقْنِيَاتِ الَّتِي تَسْتَحْوِذُ عَلَى اهْتِمَامِ الزُّوَّارِ.<br><br>وَبَيْنَ السِّيَاسَةِ وَالِاقْتِصَادِ، وَالمَلَفَّاتِ المَعِيشِيَّةِ وَالتَّطَوُّرَاتِ التِّقْنِيَّةِ، تَبْقَى المَعْلُومَةُ الدَّقِيقَةُ وَالمُوَاكَبَةُ المُسْتَمِرَّةُ عُنْوَانَ هَذِهِ النَّشْرَةِ.<br><br>هَذِهِ أَبْرَزُ العَنَاوِينِ، وَالتَّفَاصِيلُ فِي سِيَاقِ النَّشْرَةِ.'},
     {key:'headlines', label:'العناوين', type:'record', text:'المُذِيعُ: أَهْلًا بِكُمْ فِي نَشْرَتِنَا الإِخْبَارِيَّةِ.<br><br>فِي أَبْرَزِ العَنَاوِينِ:<br><br>الحُكُومَةُ تُعْلِنُ خُطَّةً جَدِيدَةً لِتَطْوِيرِ شَبَكَةِ النَّقْلِ العَامِّ، وَمَشْرُوعٌ تَجْرِيبِيٌّ يَبْدَأُ العَمَلَ فِي عَدَدٍ مِنَ المُدُنِ.<br><br>وَفِي قِطَاعِ الطَّاقَةِ، ارْتِفَاعٌ مَلْحُوظٌ فِي الاسْتِثْمَارَاتِ فِي مَشَارِيعِ الطَّاقَةِ الشَّمْسِيَّةِ، وَتَوَقُّعَاتٌ بِإِنْشَاءِ آلَافِ فُرَصِ العَمَلِ.<br><br>وَفِي تَقْرِيرِنَا الخَاصِّ، نَتَابِعُ كَيْفَ بَدَأَتْ مُدُنٌ صَغِيرَةٌ فِي الاعْتِمَادِ عَلَى الطَّاقَةِ الشَّمْسِيَّةِ لِتَقْلِيلِ تَكْلِفَةِ الكَهْرَبَاءِ.<br><br>وَمِنَ العَاصِمَةِ، مُرَاسِلُنَا يَتَابِعُ آخِرَ التَّطَوُّرَاتِ بَعْدَ اجْتِمَاعِ مَجْلِسِ الوُزَرَاءِ.<br><br>وَفِي الخَارِجِ، تَقْرِيرٌ مِنْ مَدِينَةٍ سَاحِلِيَّةٍ تَشْهَدُ إِطْلَاقَ مَشْرُوعٍ بِيئِيٍّ وَاسِعٍ لِحِمَايَةِ الشَّاطِئِ.<br><br>وَالتَّفَاصِيلُ بَعْدَ قَلِيلٍ.'},
     {key:'details', label:'التفاصيل', type:'record', text:'📰 الخبر الأول — النقل العام<br><br>أَعْلَنَتِ الحُكُومَةُ اليَوْمَ إِطْلَاقَ خُطَّةٍ جَدِيدَةٍ لِتَطْوِيرِ قِطَاعِ النَّقْلِ العَامِّ، تَتَضَمَّنُ إِدْخَالَ حَافِلَاتٍ حَدِيثَةٍ تَعْمَلُ بِالطَّاقَةِ الكَهْرَبَائِيَّةِ، وَإِنْشَاءَ مَحَطَّاتٍ جَدِيدَةٍ فِي عَدَدٍ مِنَ المَنَاطِقِ.<br><br>وَقَالَ وَزِيرُ النَّقْلِ، خِلَالَ مُؤْتَمَرٍ صُحُفِيٍّ، إِنَّ المَرْحَلَةَ الأُولَى مِنَ المَشْرُوعِ سَتَبْدَأُ خِلَالَ الأَشْهُرِ المُقْبِلَةِ، عَلَى أَنْ يَتِمَّ تَقْيِيمُ النَّتَائِجِ قَبْلَ الِانْتِقَالِ إِلَى المَرْحَلَةِ الثَّانِيَةِ.<br><br>وَأَضَافَ أَنَّ المَشْرُوعَ يَهْدِفُ إِلَى تَخْفِيفِ الِازْدِحَامِ دَاخِلَ المُدُنِ، وَتَقْلِيلِ اسْتِهْلَاكِ الوُقُودِ، وَتَحْسِينِ مُسْتَوَى الخِدْمَاتِ المُقَدَّمَةِ لِلْمُوَاطِنِينَ.<br><br>وَأَوْضَحَ الوَزِيرُ أَيْضًا أَنَّ الحَافِلَاتِ الجَدِيدَةَ سَتَعْتَمِدُ نِظَامًا إِلِكْتُرُونِيًّا لِلدَّفْعِ، يُتِيحُ لِلرُّكَّابِ اسْتِخْدَامَ بِطَاقَةٍ وَاحِدَةٍ فِي مُخْتَلِفِ خُطُوطِ النَّقْلِ.<br><br>وَمِنَ المُتَوَقَّعِ أَنْ يَسْتَفِيدَ مِنَ المَرْحَلَةِ الأُولَى لِلْمَشْرُوعِ أَكْثَرُ مِنْ مِئَةِ أَلْفِ رَاكِبٍ يَوْمِيًّا.<br><br>📰 الخبر الثاني — الطاقة المتجددة<br><br>وَفِي قِطَاعِ الطَّاقَةِ، أَعْلَنَتْ مَجْمُوعَةٌ مِنَ الشَّرِكَاتِ المَحَلِّيَّةِ وَالأَجْنَبِيَّةِ عَنْ اسْتِثْمَارَاتٍ جَدِيدَةٍ فِي مَشَارِيعِ الطَّاقَةِ الشَّمْسِيَّةِ.<br><br>وَبِحَسَبِ الأَرْقَامِ الأَوَّلِيَّةِ، مِنَ المُتَوَقَّعِ أَنْ تَتَجَاوَزَ قِيمَةُ الاسْتِثْمَارَاتِ الجَدِيدَةِ مِئَاتِ مَلَايِينِ الدُّولَارَاتِ خِلَالَ السَّنَوَاتِ الثَّلَاثِ المُقْبِلَةِ.<br><br>وَتَشْمَلُ المَشَارِيعُ إِنْشَاءَ مَحَطَّاتٍ لِإِنْتَاجِ الكَهْرَبَاءِ، إِضَافَةً إِلَى مَصَانِعَ صَغِيرَةٍ لِتَجْمِيعِ الأَلْوَاحِ الشَّمْسِيَّةِ وَمُعَدَّاتِ تَخْزِينِ الطَّاقَةِ.<br><br>وَيَرَى خُبَرَاءُ أَنَّ التَّوَسُّعَ فِي هَذَا القِطَاعِ يُمْكِنُ أَنْ يُسَاهِمَ فِي خَفْضِ الِاعْتِمَادِ عَلَى مَصَادِرِ الطَّاقَةِ التَّقْلِيدِيَّةِ، وَخَلْقِ فُرَصِ عَمَلٍ جَدِيدَةٍ، خُصُوصًا لِلشَّبَابِ المُتَخَصِّصِينَ فِي مَجَالَاتِ الهَنْدَسَةِ وَالتِّكْنُولُوجْيَا.'},
     {key:'field', label:'المراسل الميداني', type:'record', text:'المُذِيعُ: وَمِنَ العَاصِمَةِ، نَنْتَقِلُ إِلَى مُرَاسِلِنَا المَوْجُودِ فِي مَوْقِعِ إِطْلَاقِ المَشْرُوعِ البِيئِيِّ. (اسْمُ المُرَاسِلِ)، مَاذَا يَجْرِي هُنَاكَ؟<br><br>المُرَاسِلُ: مَسَاءُ الخَيْرِ. نَحْنُ الآنَ فِي المِنْطَقَةِ السَّاحِلِيَّةِ الَّتِي شَهِدَتْ صَبَاحَ اليَوْمِ إِطْلَاقَ المَرْحَلَةِ الأُولَى مِنْ مَشْرُوعِ حِمَايَةِ الشَّاطِئِ.<br><br>وَقَدْ بَدَأَتِ الفِرَقُ المُخْتَصَّةُ مُنْذُ سَاعَاتِ الصَّبَاحِ بِزِرَاعَةِ الأَشْجَارِ وَالنَّبَاتَاتِ السَّاحِلِيَّةِ، إِلَى جَانِبِ إِزَالَةِ كَمِّيَّاتٍ كَبِيرَةٍ مِنَ النُّفَايَاتِ المُتَرَاكِمَةِ عَلَى امْتِدَادِ الشَّاطِئِ.<br><br>وَيَقُولُ المُشْرِفُونَ عَلَى المَشْرُوعِ إِنَّ المَرْحَلَةَ الأُولَى سَتَسْتَمِرُّ عِدَّةَ أَشْهُرٍ، وَسَتَشْمَلُ تَنْظِيفَ المِنْطَقَةِ وَإِنْشَاءَ مَسَاحَاتٍ خَضْرَاءَ وَمَمَرَّاتٍ مُخَصَّصَةٍ لِلْمُشَاةِ.<br><br>كَمَا يُشَارِكُ عَدَدٌ كَبِيرٌ مِنَ المُتَطَوِّعِينَ فِي الحَمْلَةِ، بَيْنَهُمْ طُلَّابٌ مِنَ المَدَارِسِ وَالجَامِعَاتِ.<br><br>وَبِحَسَبِ القَائِمِينَ عَلَى المَشْرُوعِ، فَإِنَّ الهَدَفَ لَا يَقْتَصِرُ عَلَى تَحْسِينِ المَنْظَرِ العَامِّ، بَلْ يَشْمَلُ أَيْضًا حِمَايَةَ الحَيَاةِ البَحْرِيَّةِ وَالحَدَّ مِنْ تَآكُلِ الشَّاطِئِ.<br><br>مِنْ هُنَا، (اسْمُ المُرَاسِلِ)، إِلَى الِاسْتُودْيُو.'},
     {key:'fixed', label:'المراسل الثابت', type:'record', text:'المُذِيعُ: شُكْرًا لَكَ. وَنَنْتَقِلُ الآنَ إِلَى العَاصِمَةِ، حَيْثُ عَقَدَ مَجْلِسُ الوُزَرَاءِ اجْتِمَاعًا لِمُنَاقَشَةِ عَدَدٍ مِنَ المَلَفَّاتِ الِاقْتِصَادِيَّةِ وَالخِدْمِيَّةِ. مَعَنَا مِنْ أَمَامِ مَقَرِّ مَجْلِسِ الوُزَرَاءِ مُرَاسِلُنَا (اسْمُ المُرَاسِلِ). مَا أَبْرَزُ مَا خَرَجَ بِهِ الِاجْتِمَاعُ؟<br><br>المُرَاسِلُ: مَسَاءُ الخَيْرِ. الِاجْتِمَاعُ الَّذِي اسْتَمَرَّ عِدَّةَ سَاعَاتٍ نَاقَشَ مَجْمُوعَةً مِنَ المَلَفَّاتِ، كَانَ أَبْرَزُهَا خُطَّةَ تَطْوِيرِ النَّقْلِ العَامِّ، وَمَشْرُوعَ الطَّاقَةِ المُتَجَدِّدَةِ.<br><br>وَبِحَسَبِ المَعْلُومَاتِ الَّتِي حَصَلْنَا عَلَيْهَا، فَقَدْ طَلَبَ رَئِيسُ الحُكُومَةِ مِنَ الوُزَرَاءِ المَعْنِيِّينَ تَقْدِيمَ جَدْوَلٍ زَمَنِيٍّ وَاضِحٍ لِتَنْفِيذِ المَشَارِيعِ، مَعَ تَحْدِيدِ مَصَادِرِ التَّمْوِيلِ وَمَرَاحِلِ التَّنْفِيذِ.<br><br>كَمَا نَاقَشَ المَجْلِسُ خُطَّةً لِدَعْمِ المُؤَسَّسَاتِ الصَّغِيرَةِ وَالمُتَوَسِّطَةِ، خُصُوصًا الشَّرِكَاتِ العَامِلَةَ فِي مَجَالَاتِ التِّكْنُولُوجْيَا وَالطَّاقَةِ.<br><br>وَمِنَ المُتَوَقَّعِ أَنْ تُعْلِنَ الحُكُومَةُ خِلَالَ الأَيَّامِ المُقْبِلَةِ عَنْ تَفَاصِيلَ إِضَافِيَّةٍ تَتَعَلَّقُ بِآلِيَّاتِ تَنْفِيذِ هَذِهِ القَرَارَاتِ.<br><br>مِنْ أَمَامِ مَقَرِّ مَجْلِسِ الوُزَرَاءِ، (اسْمُ المُرَاسِلِ)، إِلَى الِاسْتُودْيُو.'},
     {key:'report', label:'التقرير الإخباري', type:'record', text:'وَفِي تَقْرِيرِنَا التَّالِي، نَتَابَعُ تَجْرِبَةَ إِحْدَى المُدُنِ الصَّغِيرَةِ فِي الِاعْتِمَادِ عَلَى الطَّاقَةِ الشَّمْسِيَّةِ.<br><br>فِي السَّنَوَاتِ الأَخِيرَةِ، بَدَأَتِ الطَّاقَةُ الشَّمْسِيَّةُ تَتَحَوَّلُ مِنْ خِيَارٍ مَحْدُودٍ إِلَى مَصْدَرٍ رَئِيسِيٍّ لِإِنْتَاجِ الكَهْرَبَاءِ فِي عَدَدٍ مُتَزَايِدٍ مِنَ المُدُنِ الصَّغِيرَةِ.<br><br>وَفِي هَذِهِ المَدِينَةِ، أَصْبَحَتِ الأَلْوَاحُ الشَّمْسِيَّةُ فَوْقَ أَسْطُحِ المَنَازِلِ وَالمَبَانِي العَامَّةِ جُزْءًا مِنَ المَشْهَدِ اليَوْمِيِّ.<br><br>وَيَقُولُ المَسْؤُولُونَ إِنَّ المَشْرُوعَ بَدَأَ قَبْلَ عَامَيْنِ، عِنْدَمَا ارْتَفَعَتْ تَكْلِفَةُ تَشْغِيلِ المُوَلِّدَاتِ التَّقْلِيدِيَّةِ.<br><br>وَبَعْدَ تَرْكِيبِ أَوَّلِ مَجْمُوعَةٍ مِنَ الأَلْوَاحِ، بَدَأَتِ البَلَدِيَّةُ بِتَوْسِيعِ المَشْرُوعِ تَدْرِيجِيًّا.<br><br>وَاليَوْمَ، تُنْتِجُ المَحَطَّةُ جُزْءًا كَبِيرًا مِنِ احْتِيَاجَاتِ المَبَانِي العَامَّةِ، فِيمَا تَسْتَفِيدُ عَدَدٌ مِنَ المَنَازِلِ مِنْ أَنْظِمَةِ تَخْزِينِ الطَّاقَةِ خِلَالَ سَاعَاتِ اللَّيْلِ.<br><br>وَلَا يَقْتَصِرُ المَشْرُوعُ عَلَى إِنْتَاجِ الكَهْرَبَاءِ.<br><br>فَقَدْ أَنْشَأَتِ المَدِينَةُ أَيْضًا مَرْكَزًا تَدْرِيبِيًّا لِتَعْلِيمِ الشَّبَابِ كَيْفِيَّةَ تَرْكِيبِ أَنْظِمَةِ الطَّاقَةِ الشَّمْسِيَّةِ وَصِيَانَتِهَا.<br><br>وَيَأْمُلُ المَسْؤُولُونَ أَنْ تَتَحَوَّلَ هَذِهِ التَّجْرِبَةُ إِلَى نَمُوذَجٍ يُمْكِنُ تَطْبِيقُهُ فِي مَنَاطِقَ أُخْرَى.'},
     {key:'practice', label:'نص للتدريب', type:'text', body:'🎬 المُقَدِّمَةُ<br>المُذِيعُ: مَسَاءُ الخَيْرِ، وَأَهْلًا بِكُمْ فِي نَشْرَتِنَا الإِخْبَارِيَّةِ.<br>فِي أَبْرَزِ العَنَاوِينِ: بَدْءُ تَنْفِيذِ مَشْرُوعٍ جَدِيدٍ لِتَطْوِيرِ شَبَكَاتِ المِيَاهِ، وَخُطَّةٌ لِتَقْلِيلِ الفَاقِدِ فِي شَبَكَاتِ التَّوْزِيعِ. وَفِي قِطَاعِ التَّعْلِيمِ، إِطْلَاقُ بَرْنَامَجٍ تَدْرِيبِيٍّ جَدِيدٍ لِتَطْوِيرِ المَهَارَاتِ الرَّقْمِيَّةِ لَدَى الطُّلَّابِ. وَفِي تَقْرِيرٍ خَاصٍّ، نَأْخُذُكُمْ إِلَى إِحْدَى المَدَارِسِ الَّتِي بَدَأَتْ بِاسْتِخْدَامِ تَقْنِيَاتِ الذَّكَاءِ الِاصْطِنَاعِيِّ فِي العَمَلِيَّةِ التَّعْلِيمِيَّةِ. وَمِنْ أَمَامِ مَجْلِسِ النُّوَّابِ، مُرَاسِلُنَا يَتَابِعُ آخِرَ التَّطَوُّرَاتِ حَوْلَ مَشْرُوعِ قَانُونٍ جَدِيدٍ لِدَعْمِ الشَّرِكَاتِ النَّاشِئَةِ. وَمِنَ الخَارِجِ، مُرَاسِلُنَا يَنْقُلُ لَنَا أَجْوَاءَ مَعْرِضٍ دَوْلِيٍّ لِلتِّكْنُولُوجْيَا وَالطَّاقَةِ النَّظِيفَةِ.<br><br>📰 الخَبَرُ الأَوَّلُ — المِيَاهُ<br>المُذِيعُ: بَدَأَتِ السُّلُطَاتُ اليَوْمَ تَنْفِيذَ المَرْحَلَةِ الأُولَى مِنْ مَشْرُوعٍ لِتَطْوِيرِ شَبَكَةِ المِيَاهِ فِي عَدَدٍ مِنَ المَنَاطِقِ. وَيَشْمَلُ المَشْرُوعُ تَحْدِيثَ خُطُوطِ نَقْلِ المِيَاهِ، وَإِنْشَاءَ خَزَّانَاتٍ جَدِيدَةٍ، إِضَافَةً إِلَى تَرْكِيبِ أَنْظِمَةِ مُرَاقَبَةٍ إِلِكْتُرُونِيَّةٍ تُسَاعِدُ عَلَى اكْتِشَافِ التَّسَرُّبَاتِ. وَقَالَ المَسْؤُولُونَ إِنَّ جُزْءًا كَبِيرًا مِنَ المِيَاهِ المَهْدُورَةِ يَعُودُ إِلَى قِدَمِ شَبَكَاتِ التَّوْزِيعِ. وَمِنَ المُتَوَقَّعِ أَنْ تَنْتَهِيَ المَرْحَلَةُ الأُولَى خِلَالَ عَامٍ.<br><br>📰 الخَبَرُ الثَّانِي — التَّعْلِيمُ<br>المُذِيعُ: وَفِي قِطَاعِ التَّعْلِيمِ، أَعْلَنَتْ وِزَارَةُ التَّرْبِيَةِ إِطْلَاقَ بَرْنَامَجٍ جَدِيدٍ لِتَطْوِيرِ المَهَارَاتِ الرَّقْمِيَّةِ لَدَى الطُّلَّابِ، وَيَشْمَلُ تَدْرِيبًا عَلَى البَرْمَجَةِ وَالذَّكَاءِ الِاصْطِنَاعِيِّ وَالأَمْنِ الرَّقْمِيِّ. وَسَيَبْدَأُ البَرْنَامَجُ تَجْرِيبِيًّا فِي عَدَدٍ مِنَ المَدَارِسِ قَبْلَ تَعْمِيمِهِ.<br><br>🎥 التَّقْرِيرُ الخَاصُّ — الذَّكَاءُ الِاصْطِنَاعِيُّ فِي التَّعْلِيمِ<br>المُذِيعُ: وَفِي هَذَا التَّقْرِيرِ، نَتَعَرَّفُ إِلَى تَجْرِبَةِ إِحْدَى المَدَارِسِ الَّتِي بَدَأَتْ بِاسْتِخْدَامِ أَدَوَاتِ الذَّكَاءِ الِاصْطِنَاعِيِّ فِي التَّعْلِيمِ.<br>التَّقْرِيرُ: فِي هَذَا الصَّفِّ، لَمْ تَعُدِ الكُتُبُ وَالأَقْلَامُ الوَسِيلَةَ الوَحِيدَةَ لِلتَّعَلُّمِ. فَالطُّلَّابُ يَسْتَخْدِمُونَ أَجْهِزَةً لَوْحِيَّةً وَبَرَامِجَ تَعْلِيمِيَّةً تُسَاعِدُهُمْ عَلَى فَهْمِ الدُّرُوسِ بِطَرِيقَةٍ تَفَاعُلِيَّةٍ. لَكِنَّ المَدْرَسَةَ تُؤَكِّدُ أَنَّ التِّكْنُولُوجْيَا لَا تَحُلُّ مَحَلَّ المُعَلِّمِ، بَلْ يَسْتَخْدِمُهَا كَأَدَاةٍ إِضَافِيَّةٍ.<br><br>🎤 مُرَاسِلٌ خَارِجِيٌّ<br>المُذِيعُ: وَنَنْتَقِلُ الآنَ إِلَى مُرَاسِلِنَا المَوْجُودِ فِي المَعْرِضِ الدَّوْلِيِّ لِلتِّكْنُولُوجْيَا وَالطَّاقَةِ النَّظِيفَةِ. (اسْمُ المُرَاسِلِ)، كَيْفَ تَبْدُو أَجْوَاءُ المَعْرِضِ؟<br>المُرَاسِلُ: الأَجْوَاءُ هُنَا نَشِطَةٌ لِلْغَايَةِ. المَعْرِضُ يَجْمَعُ شَرِكَاتٍ مُتَخَصِّصَةً فِي التِّكْنُولُوجْيَا وَالطَّاقَةِ النَّظِيفَةِ، وَمِنْ أَبْرَزِ المَعْرُوضَاتِ أَنْظِمَةُ تَخْزِينِ الطَّاقَةِ وَالسَّيَّارَاتُ الكَهْرَبَائِيَّةُ. مِنْ هُنَا، (اسْمُ المُرَاسِلِ)، إِلَى الِاسْتُودْيُو.<br><br>🏛️ مُرَاسِلُ مَجْلِسِ النُّوَّابِ<br>المُذِيعُ: شُكْرًا لَكَ. وَنَنْتَقِلُ إِلَى مَجْلِسِ النُّوَّابِ، حَيْثُ شَهِدَتْ جَلْسَةُ اليَوْمِ نِقَاشًا حَوْلَ مَشْرُوعِ قَانُونٍ جَدِيدٍ لِدَعْمِ الشَّرِكَاتِ النَّاشِئَةِ. مَعَنَا مُرَاسِلُنَا (اسْمُ المُرَاسِلِ). مَا أَبْرَزُ مَا حَدَثَ دَاخِلَ الجَلْسَةِ؟<br>المُرَاسِلُ: مَسَاءُ الخَيْرِ. شَهِدَتِ الجَلْسَةُ نِقَاشًا مُطَوَّلًا حَوْلَ مَشْرُوعِ القَانُونِ الَّذِي يَهْدِفُ إِلَى تَقْدِيمِ حَوَافِزَ لِلشَّرِكَاتِ النَّاشِئَةِ. وَطَالَبَ عَدَدٌ مِنَ النُّوَّابِ بِإِضَافَةِ ضَمَانَاتٍ تَكْفُلُ وُصُولَ الدَّعْمِ إِلَى الشَّرِكَاتِ الصَّغِيرَةِ. مِنْ مَجْلِسِ النُّوَّابِ، (اسْمُ المُرَاسِلِ)، إِلَى الِاسْتُودْيُو.<br><br>🎬 الخَاتِمَةُ<br>المُذِيعُ: إِلَى هُنَا تَنْتَهِي نَشْرَتُنَا الإِخْبَارِيَّةُ. شُكْرًا لِحُسْنِ مُتَابَعَتِكُمْ. كَانَ مَعَكُمْ (اسْمُ المُذِيعِ). إِلَى اللِّقَاءِ.'}
   ]},

const GENERAL_UNITS = [   {t:'الإحماء الصوتي السريع (٣ دقائق)', d:'أ. التنفّس (٣ مرات): شهيق من الأنف لمدة ٤ ثوانٍ، زفير بطيء لمدة ٦-٨ ثوانٍ، يُكرَّر ٣ مرات. ثم: (هـــا) يُخرج المتدرب الهواء بهدوء مع إطالة الصوت.<br><br> ب. اهتزاز الشفتين (٣٠-٦٠ ثانية): (بْرررررررررررر...) ثم: (بْرررررررر... بْرررررررر... بْرررررررر...) ثم تدرّج الطبقة: مرتفعة ← متوسطة ← منخفضة، ثم بالعكس: منخفضة ← متوسطة ← مرتفعة.<br><br> ج. الطنين (٣٠ ثانية): (مْمْمْمْمْمْمْم...) ثم: (مُــمْ - مَــمْ - مِــمْ - مُــمْ) ثم: (مَا - مِي - مُو - مَا - مِي - مُو).<br><br> د. مخارج الحروف (٣٠ ثانية): (بَ-بُ-بِ) (تَ-تُ-تِ) (دَ-دُ-دِ) (كَ-كُ-كِ) (قَ-قُ-قِ) ثم: (بْرَا-تْرَا-كْرَا-غْرَا) ثم بسرعة تدريجية: (بْرَا تْرَا كْرَا غْرَا).'},   {t:'التحكّم في النبرة (٥ دقائق)', d:'أ. الجملة بخمس نبرات - الجملة: (أنا لم أقل إنك أخطأت). تُؤدَّى: ١) بنبرة محايدة. ٢) مع تأكيد (أنا). ٣) مع تأكيد (أقل). ٤) مع تأكيد (أخطأت). ٥) بنبرة استفهام وشك: (أنا لم أقل إنك أخطأت؟).<br><br> ب. تغيير الطبقة - نفس الجملة تُؤدَّى بالترتيب: منخفضة ← متوسطة ← مرتفعة ← متوسطة ← منخفضة.<br><br> ج. تغيير الحالة - نفس الجملة تُؤدَّى: غضب ← خوف ← سخرية.'},   {t:'التحكّم في النبرة والانفعال (٥ دقائق)', d:'أ. تثبيت الطبقة - الجملة: (لم أكن أتوقع أن يحدث هذا). تُقرأ ٥ مرات بطبقة ثابتة، ثم: منخفضة ← متوسطة ← مرتفعة.<br><br> ب. نقل مركز النبرة - الجملة: (أنا لم أقل إنك أخطأت). يُغيّر المتدرب الكلمة التي تحمل أهم معلومة في كل مرة، مع الحفاظ على الكلمات نفسها.<br><br> ج. تغيير المعنى دون تغيير الكلمات - الجملة: (أخيراً وصلت، كنت أنتظرك منذ وقت طويل). تُؤدَّى: فرح ← حزن ← غضب مكبوت ← خوف ← سخرية ← ارتياح.<br><br> د. القوس النبري - الجملة: (اسمعني جيداً، لدينا وقت قليل). التدرّج: منخفض ← متوسط ← مرتفع ← متوسط ← منخفض، ثم بالعكس: مرتفع ← متوسط ← منخفض ← متوسط ← مرتفع.<br><br> هـ. محاكاة الدوبلاج - الجملة: (لا تذهب! انتظرني، أرجوك!) تُؤدَّى: ١) بشكل طبيعي. ٢) كأن الشخص يبتعد. ٣) بخوف شديد. ٤) بأداء سينمائي دون صراخ.'},   {t:'تنويع الطبقة الصوتية (٣ دقائق)', d:'أ. السلّم اللحني - الجملة: (لم أكن أتوقع أن تأتي اليوم). التدرّج الصاعد: منخفض ← منخفض/متوسط ← متوسط ← متوسط/مرتفع ← مرتفع، ثم التدرّج الهابط بالعكس.<br><br> ب. تغيير نقطة القمة - نفس الجملة: القمة في البداية، ثم القمة في الوسط، ثم القمة في النهاية.<br><br> ج. ثلاث شخصيات - الجملة: (أنا أعرف ما يجب أن نفعله). تُؤدَّى: شخصية هادئة ← شخصية متحمسة ← شخصية حزينة.<br><br> د. التحدي - الجملة: (أنت تعرف جيداً ماذا سيحدث إذا فعلت ذلك). تُؤدَّى: تحذير ← تهديد ← خوف ← سخرية ← ثقة.'},   {t:'التعبير العاطفي (٥ دقائق)', d:'أ. نفس الجملة، ستة مشاعر - الجملة: (أخيراً وصلت... كنت أنتظرك منذ وقت طويل). تُؤدَّى: فرح ← حزن ← غضب مكبوت ← خوف ← سخرية ← ارتياح.<br><br> ب. بناء العاطفة من الدافع - نفس الجملة، يتخيّل المتدرب في كل مرة موقفاً مختلفاً: وصل شخص يحبه بعد غياب طويل / وصل شخص لن يبقى طويلاً / وصل شخص كان غاضباً منه / وصل شخص كان يخشى فقده. ثم يؤدي الجملة وفق الموقف.<br><br> ج. المستوى الاحترافي - الجملة: (لا، لا تذهب... ابقَ هنا قليلاً). تُؤدَّى: خوفاً من فقد شخص ← غضباً مخفياً ← توسّلاً حقيقياً ← قوة تُخفي ضعفاً.<br><br> د. الاختبار - يسجّل المتدرب الجملة دون ذكر اسم الشعور، ثم يستمع إليها ويحاول تحديد الشعور من الصوت فقط.'},   {t:'ضبط سرعة الأداء (٥ دقائق)', d:'أ. السرعة البطيئة - الجملة: (كنت أعرف أن هذا اليوم سيأتي، لكنني لم أتوقع أن يحدث بهذه السرعة). الأداء: (كنت أعرف / أن هذا اليوم سيأتي // لكنني لم أتوقع / أن يحدث بهذه السرعة).<br><br> ب. السرعة الطبيعية - نفس الجملة تُقرأ بسرعة محادثة طبيعية.<br><br> ج. السرعة السريعة - نفس الجملة تُؤدَّى بسرعة أعلى بنسبة ٢٠-٣٠٪، مع الحفاظ على وضوح مخارج الحروف.<br><br> د. المسرّع والمبطئ - الجملة: (اسمعني جيداً، لدينا وقت قليل جداً). التدرّج: بطيء ← متوسط ← سريع ← متوسط ← بطيء.<br><br> هـ. السرعة والانفعال - الجملة: (ماذا حدث؟ أين هو؟ أخبرني الآن!) تُؤدَّى: هادئة ← متوترة ← مذعورة.'},   {t:'القراءة الجهرية المرتجلة (٥ دقائق)', d:'أ. الكلمات العشوائية - يتحدث المتدرب لمدة ٣٠ ثانية عن كل كلمة: (المطار) (السفر) (الخوف) (المغامرة) (النجاح). يبدأ الكلام خلال ٣ ثوانٍ من ظهور الكلمة.<br><br> ب. الانتقال بين الأفكار - المطار ← السفر ← الخوف ← المغامرة ← النجاح. ينتقل المتدرب بين الكلمات دون توقف.<br><br> ج. الارتجال المنظم - الموضوع: (هل يعتمد النجاح على الحظ؟) يتحدث المتدرب لمدة دقيقة، وعند فقدان الفكرة يقول: (وهنا نصل إلى نقطة أخرى مهمة...) ثم يتابع.<br><br> د. التعليق الصوتي المرتجل - العنوان: (أهمية النوم) يتحدث المتدرب لمدة دقيقة كاملة كما لو أنه يقدم فقرة إذاعية.'},   {t:'بناء شخصية صوتية من الصفر (١٠ دقائق)', d:'أ. الجسم - الشخصية: (رجل كبير في السن، متعب، لكنه واثق). يُخفض المتدرب الكتفين، ويميل الرأس قليلاً، ويبطئ الحركة، ويجعل التنفس أثقل قليلاً، ثم يقول: (ماذا تريد مني؟)<br><br> ب. مركز الصوت - نفس الجملة تُؤدَّى: رنين صدري ← رنين في الفم ← رنين في الأنف والوجه، ثم يختار المتدرب الرنين المناسب للشخصية.<br><br> ج. الطبقة - الجملة: (أنا لا أخاف منك). تُؤدَّى: منخفضة ← متوسطة ← مرتفعة، ثم يختار المتدرب الطبقة المناسبة.<br><br> د. الإيقاع - الجملة: (انتظر! لا تذهب قبل أن أخبرك بالحقيقة). تُؤدَّى: بطيء ← متوسط ← سريع.<br><br> هـ. المحرّك الداخلي - الجملة: (اسمعني جيداً... أنا أحاول مساعدتك). تُؤدَّى بأربع نوايا: إقناع ← تخويف ← خداع ← استرضاء.<br><br> و. الاختبار النهائي - ثوابت الشخصية: العمر ستون عاماً، الطبقة منخفضة، الرنين صدري، السرعة بطيئة، الحالة واثق لكنه متعب. الجمل: (أين كنت؟) (لماذا فعلت ذلك؟) (تعال معي). يجب أن تبقى هوية الشخصية الصوتية ثابتة في الجمل الثلاث.<br><br> ز. الاختبار المتقدم للشخصية - النص: (لم أكن أعرف أنك ستعود. لقد مرّ وقت طويل منذ آخر مرة رأيتك فيها. كنت أظن أنني لن أراك مجدداً). يُسجّل المتدرب النص ٦ مرات، وفي كل تسجيل يغيّر عنصراً واحداً فقط: الطبقة ← الرنين ← السرعة ← التنفس ← النطق ← الطاقة، ثم يقارن التسجيلات ويحدد العنصر الأكثر تأثيراً في هوية الشخصية.'} ];

function pct(n,d){ return d? Math.round(n/d*100):0; }

function ring(percent, size=54){
  const r = (size-8)/2, c = 2*Math.PI*r, off = c - (percent/100)*c;
  return `<svg width="${size}" height="${size}" class="shrink-0">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#382f47" stroke-width="6" fill="none"/>
    <circle class="progress-ring" cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--gold)" stroke-width="6" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
      transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function header(title, back){
  return `<div class="flex items-center gap-3 px-5 pt-6 pb-4">

}

function suggestionCard(secs){
  const order = ['breathing','grammar','performance','general'];
  let target = null;
  for(const id of order){
    const s = secs.find(x=>x.id===id);
    if(s && s.pct>0 && s.pct<100){ target = s; break; }
  }
  if(!target){
    for(const id of order){
      const s = secs.find(x=>x.id===id);
      if(s && s.pct===0){ target = s; break; }
    }
  }
  if(!target) return '';
  const isNew = target.pct===0;
  return `<button onclick="go('${target.id}')" class="card p-4 flex items-center gap-3.5 w-full text-right" style="border:1px solid var(--gold)">
    <div class="w-11 h-11 shrink-0 neu neu-square ${target.cls} icon-btn">${target.icon}</div>
    <div class="flex-1">
      <div class="text-[10px] txt-gold font-800">${isNew?'اقتراح اليوم':'أكمل من حيث توقفت'}</div>
      <div class="text-sm font-700 mt-0.5">${target.title} — ${target.pct}%</div>
    </div>
    <span class="icon-btn icon-sm txt-gold">${ICONS.arrowLeft}</span>
  </button>`;
}

/* ============ تسجيل صوت حقيقي عبر المتصفح ============ */
const SADA_BUILD = 'v16-me';
let liveRecorder = null, liveChunks = [], liveStream = null, liveStartTime = 0, lastRecordingUrl = null;
function pickMime(){
  try{
    if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) return 'audio/webm;codecs=opus';
    if(MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
    if(MediaRecorder.isTypeSupported('audio/mp4')) return 'audio/mp4';
  }catch(e){}
  return '';
}
async function acquireMicStream(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    return {ok:false, error:'المتصفح لا يدعم الميكروفون هنا. افتح الرابط عبر HTTPS في Safari أو Chrome مباشرة (وليس داخل تطبيق مدمج).'};
  }
  if(typeof MediaRecorder==='undefined'){
    return {ok:false, error:'هذا المتصفح لا يدعم تسجيل الصوت (MediaRecorder). جرّب Chrome أو Safari حديث.'};
  }
  try{
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, autoGainControl:false, noiseSuppression:true, channelCount:1}});
    }catch(e1){
      if(e1 && (e1.name==='OverconstrainedError' || e1.name==='TypeError')) stream = await navigator.mediaDevices.getUserMedia({audio:true});
      else throw e1;
    }
    return {ok:true, stream};
  }catch(e){
    const n = e && e.name;
    let msg = 'تعذّر الوصول للميكروفون.';
    if(n==='NotAllowedError' || n==='SecurityError') msg = 'تم رفض إذن الميكروفون. اسمح به من إعدادات الموقع في المتصفح (أيقونة القفل بجانب الرابط) ثم أعد المحاولة.';
    else if(n==='NotFoundError' || n==='OverconstrainedError') msg = 'لم يتم العثور على ميكروفون في هذا الجهاز.';
    else if(n==='NotReadableError' || n==='AbortError') msg = 'الميكروفون مشغول بتطبيق آخر. أغلق التطبيقات التي تستخدمه وأعد المحاولة.';
    return {ok:false, error:msg};
  }
}
async function beginLiveRecording(){
  if(liveStream){ try{ liveStream.getTracks().forEach(t=>t.stop()); }catch(e){} liveStream=null; }
  const m = await acquireMicStream();
  if(!m.ok) return m;
  liveStream = m.stream;
  try{
    liveChunks = [];
    const mime = pickMime();
    liveRecorder = mime ? new MediaRecorder(liveStream, {mimeType:mime}) : new MediaRecorder(liveStream);
    liveRecorder.ondataavailable = e => { if(e.data && e.data.size>0) liveChunks.push(e.data); };
    liveRecorder.start(1000);
    liveStartTime = performance.now();
    return {ok:true};
  }catch(e){
    try{ liveStream.getTracks().forEach(t=>t.stop()); }catch(_){}
    liveStream = null; liveRecorder = null;
    return {ok:false, error:'فشل بدء التسجيل في هذا المتصفح. جرّب Chrome أو Safari حديث.'};
  }
}
function endLiveRecording(){
  return new Promise(resolve=>{
    if(!liveRecorder){ resolve({seconds:0, url:null}); return; }
    const seconds = (performance.now()-liveStartTime)/1000;
    liveRecorder.onstop = ()=>{
      const blob = new Blob(liveChunks, {type: (liveChunks[0]&&liveChunks[0].type) || 'audio/webm'});
      if(lastRecordingUrl) URL.revokeObjectURL(lastRecordingUrl);
      lastRecordingUrl = blob.size>0 ? URL.createObjectURL(blob) : null;
      if(liveStream) liveStream.getTracks().forEach(t=>t.stop());
      resolve({seconds, url:lastRecordingUrl});
    };
    try{
      if(liveRecorder.state==='inactive'){ liveRecorder.onstop(); return; }
      liveRecorder.stop();
    }catch(e){
      if(liveStream) liveStream.getTracks().forEach(t=>t.stop());
      resolve({seconds, url:null});
    }
  });
}

/* ============ مسجّل وحدات القواعد والأداءات (مسار واحد، تسجيل حقيقي بالميكروفون) ============ */
let gRec = null, gRecTimer=null, gRecPreRollTimer=null, gRecPlayTimer=null;
let gMic = null, gAudioCtx = null, gSources = [], gRecT0 = 0;
function gStopSources(){ gSources.forEach(s=>{ try{ s.stop(); }catch(e){} }); gSources = []; }
function gReleaseMic(){
  if(gMic){
    try{ if(gMic.rec && gMic.rec.state!=='inactive') gMic.rec.stop(); }catch(e){}
    try{ if(gMic.meter) gMic.meter.stop(); }catch(e){}
    try{ gMic.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    gMic = null;
  }
}
function initGRec(){
  gStopSources(); gReleaseMic();
  gRec = {duration:24, clips:[], playhead:0, playing:false, recording:false, preRoll:null, selectedClip:null, micError:null};
}
function updateGRecUI(){ const el=document.getElementById('grec-area'); if(el) el.innerHTML = renderGRec(); }
async function ggToggleRecord(){
  if(!gRec) initGRec();
  stopGuideAudio();
  if(gRec.recording){ ggFinishRecording(); return; }
  if(gRec.preRoll || gRec.acquiring) return;
  gStopSources(); clearInterval(gRecPlayTimer); gRec.playing = false;
  // طلب إذن الميكروفون مباشرة من نقرة المستخدم (ضروري على iOS/Safari)
  gRec.acquiring = true; gRec.micError = null;
  const m = await acquireMicStream();
  gRec.acquiring = false;
  if(!m.ok){ gRec.micError = m.error; updateGRecUI(); return; }
  gMic = {stream:m.stream, rec:null, chunks:[], clip:null, meter:meterStart(m.stream)};
  const recordAt = gRec.playhead;
  const leadIn = 3;
  const preRollStart = Math.max(0, recordAt - leadIn);
  gRec.playhead = preRollStart;
  gRec.preRollTarget = recordAt;
  gRec.preRoll = Math.ceil(recordAt - preRollStart) || 1;
  updateGRecUI();
  if(recordAt - preRollStart <= 0){ ggStartActualRecording(); return; }
  ggRunPreRoll();
}
function ggRunPreRoll(){
  const fromT = gRec.playhead;
  const toT = gRec.preRollTarget;
  const totalMs = (toT-fromT)*1000;
  const t0 = performance.now();
  function step(now){
    if(!gRec.preRoll) return;
    const p = Math.min(1, (now-t0)/totalMs);
    gRec.playhead = fromT + (toT-fromT)*p;
    gRec.preRoll = Math.max(1, Math.ceil(toT-gRec.playhead));
    const line = document.getElementById('grec-playhead');
    if(line) line.style.left = (gRec.playhead/gRec.duration*100)+'%';
    const btnLabel = document.getElementById('grec-preroll-num');
    if(btnLabel) btnLabel.textContent = gRec.preRoll;
    const bigLabel = document.getElementById('grec-preroll-big');
    if(bigLabel) bigLabel.textContent = gRec.preRoll;
    if(p<1){ requestAnimationFrame(step); }
    else { gRec.playhead = toT; ggStartActualRecording(); }
  }
  requestAnimationFrame(step);
}
function ggStartActualRecording(){
  gRec.preRoll = null; gRec.preRollTarget = null;
  if(!gMic){ updateGRecUI(); return; }
  const clip = {id:Date.now(), start:gRec.playhead, dur:0.1, off:0, buf:null, live:[]};
  try{
    const mime = pickMime();
    const M = gMic;
    M.rec = mime ? new MediaRecorder(M.stream, {mimeType:mime}) : new MediaRecorder(M.stream);
    M.chunks = [];
    M.rec.ondataavailable = e => { if(e.data && e.data.size>0) M.chunks.push(e.data); };
    if(M.meter) M.meter.samples = [];
    M.t0 = performance.now();
    M.rec.start(1000);
  }catch(e){
    gReleaseMic();
    gRec.micError = 'فشل بدء التسجيل في هذا المتصفح. جرّب Chrome أو Safari حديث.';
    updateGRecUI(); return;
  }
  gMic.clip = clip;
  gRecT0 = performance.now();
  gRec.clips.push(clip);
  gRec.selectedClip = clip.id;
  gRec.recording = true;
  updateGRecUI();
  gRecTimer = setInterval(()=>{
    const el = (performance.now()-gRecT0)/1000;
    gRec.playhead = +Math.min(gRec.duration, clip.start+el).toFixed(2);
    clip.dur = +Math.max(0.1, gRec.playhead-clip.start).toFixed(2);
    if(gMic && gMic.meter){ while(clip.live.length < Math.floor(el*WF_PER_SEC)) clip.live.push(gMic.meter.take()); }
    if(gRec.playhead>=gRec.duration){ gRec.playhead=gRec.duration; ggFinishRecording(); return; }
    ggLightUpdate(clip);
  },100);
}
function ggLightUpdate(clip){
  const line = document.getElementById('grec-playhead');
  if(line) line.style.left = (gRec.playhead/gRec.duration*100)+'%';
  if(clip){
    const el = document.getElementById('grec-clip-'+clip.id);
    if(el){
      el.style.width = Math.max(clip.dur/gRec.duration*100,0.5)+'%';
      el.innerHTML = clipWaveHtml(clip.buf, clip.off||0, clip.dur, clip.live, 'var(--gold)', clip.id);
    }
  }
}
function ggFinishRecording(){
  clearInterval(gRecTimer);
  gRec.recording = false;
  const m = gMic, clip = m && m.clip;
  if(!m || !clip || !m.rec){ gReleaseMic(); updateGRecUI(); return; }
  const secs = (performance.now()-gRecT0)/1000;
  clip.dur = +Math.max(0.1, Math.min(secs, gRec.duration-clip.start)).toFixed(1);
  gRec.playhead = +(clip.start+clip.dur).toFixed(1);
  clip.pending = true;
  const rec = m.rec;
  rec.onstop = async ()=>{
    try{ if(m.meter) m.meter.stop(); }catch(e){}
    try{ m.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    if(gMic===m) gMic = null;
    try{
      const blob = new Blob(m.chunks, {type:(m.chunks[0]&&m.chunks[0].type)||'audio/webm'});
      if(!blob.size) throw new Error('empty');
      const ctx = gGetCtx();
      const arr = await blob.arrayBuffer();
      clip.buf = await new Promise((res,rej)=>ctx.decodeAudioData(arr,res,rej));
      clip.dur = +Math.min(clip.dur, clip.buf.duration).toFixed(2) || clip.dur;
      const dl = calibrateDelta(clip.buf, m.meter && m.meter.samples, m.t0);
      if(dl){
        let ns = clip.start + dl, off = 0;
        if(ns < 0){ off = -ns; ns = 0; }
        clip.start = +ns.toFixed(3); clip.off = +off.toFixed(3);
        clip.dur = +Math.max(0.1, Math.min(clip.dur - off, clip.buf.duration - off, gRec.duration - ns)).toFixed(2);
        gRec.playhead = +Math.min(gRec.duration, clip.start + clip.dur).toFixed(2);
      }
      delete clip.live;
    }catch(e){
      gRec.clips = gRec.clips.filter(c=>c!==clip);
      if(gRec.selectedClip===clip.id) gRec.selectedClip = null;
      gRec.micError = 'لم يُلتقط أي صوت من الميكروفون. تأكد من الإذن وأعد التسجيل.';
    }
    clip.pending = false;
    updateGRecUI();
  };
  try{ rec.stop(); }catch(e){ rec.onstop(); }
  updateGRecUI();
}
function gGetCtx(){
  if(!gAudioCtx){ const AC = window.AudioContext || window.webkitAudioContext; gAudioCtx = new AC(); }
  if(gAudioCtx.state==='suspended') gAudioCtx.resume();
  return gAudioCtx;
}
function gSchedulePlayback(){
  gStopSources();
  let ctx; try{ ctx = gGetCtx(); }catch(e){ return; }
  const now = ctx.currentTime + 0.05;
  gRec.clips.forEach(c=>{
    if(!c.buf) return;
    const endT = c.start + c.dur;
    if(gRec.playhead >= endT) return;
    const into = Math.max(0, gRec.playhead - c.start);
    const src = ctx.createBufferSource();
    src.buffer = c.buf; src.connect(ctx.destination);
    try{ if(startSynced(src, now, Math.max(0, c.start - gRec.playhead), c.off||0, into, c.dur - into)) gSources.push(src); }catch(e){}
  });
}
let gPlayT0 = 0, gPlayHead0 = 0;
function ggPlayTick(){
  if(!gRec || !gRec.playing){ clearInterval(gRecPlayTimer); return; }
  const lat = (gAudioCtx && (gAudioCtx.outputLatency || gAudioCtx.baseLatency)) || 0;
  let ph = gPlayHead0 + (performance.now()-gPlayT0)/1000 - 0.05 - lat;
  ph = Math.max(gPlayHead0, ph);
  if(ph>=gRec.duration){
    gRec.playhead = gRec.duration; gRec.playing = false;
    clearInterval(gRecPlayTimer); gStopSources(); updateGRecUI(); return;
  }
  gRec.playhead = +ph.toFixed(2);
  ggLightUpdate(null);
}
function ggBeginPlayback(){
  clearInterval(gRecPlayTimer);
  gPlayT0 = performance.now(); gPlayHead0 = gRec.playhead;
  gSchedulePlayback();
  gRecPlayTimer = setInterval(ggPlayTick, 40);
}
function ggTogglePlay(){
  if(!gRec || !gRec.clips.length || gRec.recording) return;
  gRec.playing = !gRec.playing;
  if(gRec.playing){
    if(gRec.playhead>=gRec.duration) gRec.playhead=0;
    let ctx = null; try{ ctx = gGetCtx(); }catch(e){}
    const begin = ()=>{ if(gRec && gRec.playing) ggBeginPlayback(); };
    if(!ctx || ctx.state==='running') begin(); else ctx.resume().then(begin, begin);
  } else { clearInterval(gRecPlayTimer); gStopSources(); }
  updateGRecUI();
}
function ggStop(){
  clearInterval(gRecTimer); clearInterval(gRecPlayTimer); gStopSources();
  if(gRec.recording){ ggFinishRecording(); }
  gRec.playing=false; gRec.recording=false; gRec.preRoll=null; gRec.preRollTarget=null;
  gRec.playhead=0;
  updateGRecUI();
}
function ggSelectClip(id){ gRec.selectedClip = id; updateGRecUI(); }
let ggScrubRect = null;
function ggSeekAt(ev){
  if(gRec.recording) return;
  ev.preventDefault();
  ggScrubRect = ev.currentTarget.getBoundingClientRect();
  ggUpdatePlayheadFromEvent(ev);
  document.onpointermove = ggScrubMove;
  document.onpointerup = ggScrubEnd;
}
function ggScrubMove(ev){ if(ggScrubRect) ggUpdatePlayheadFromEvent(ev); }
function ggUpdatePlayheadFromEvent(ev){
  let pct = (ev.clientX - ggScrubRect.left) / ggScrubRect.width;
  pct = Math.max(0, Math.min(1, pct));
  gRec.playhead = +(pct*gRec.duration).toFixed(2);
  const line = document.getElementById('grec-playhead');
  if(line) line.style.left = pct*100+'%';
}
function ggScrubEnd(){
  document.onpointermove = null; document.onpointerup = null;
  ggScrubRect = null;
  if(gRec.playing){ gStopSources(); ggBeginPlayback(); }
  updateGRecUI();
}
function ggSplit(){
  const clip = gRec.clips.find(c=>c.id===gRec.selectedClip);
  if(gRec.recording || !clip || gRec.playhead<=clip.start+0.1 || gRec.playhead>=clip.start+clip.dur-0.1) return;
  const rightDur = +((clip.start+clip.dur)-gRec.playhead).toFixed(1);
  const right = {id:Date.now()+1, start:gRec.playhead, dur:rightDur, off:clip.off+(gRec.playhead-clip.start), buf:clip.buf};
  clip.dur = +(gRec.playhead-clip.start).toFixed(1);
  gRec.clips.push(right);
  gRec.clips.sort((a,b)=>a.start-b.start);
  gRec.selectedClip = right.id;
  updateGRecUI();
}
function ggDeleteSelected(){
  if(gRec.recording) return;
  gStopSources(); clearInterval(gRecPlayTimer); gRec.playing=false;
  gRec.clips = gRec.clips.filter(c=>c.id!==gRec.selectedClip);
  gRec.selectedClip = null;
  updateGRecUI();
}
function estimateDurationRange(text){
  const clean = (text||'').replace(/<br\s*\/?>/gi, ' ');
  const wordCount = clean.trim().split(/\s+/).filter(Boolean).length || 1;
  return { min: Math.max(1.5, wordCount*0.28), max: wordCount*1.3 + 1.5 };
}
function ggComplete(){
  if(gRec.recording) ggFinishRecording();
  clearInterval(gRecTimer); clearInterval(gRecPlayTimer); gStopSources(); gRec.playing=false;
  if(gRec.clips.some(c=>c.pending || !c.buf)){
    const w = document.getElementById('grec-warn'); if(w) w.textContent = 'جارٍ معالجة التسجيل… انتظر ثانية ثم اضغط متابعة.';
    return;
  }
  const totalDur = gRec.clips.reduce((s,c)=>s+c.dur, 0);
  const {min, max} = estimateDurationRange(gRec.targetText);
  const warnEl = document.getElementById('grec-warn');
  if(totalDur < min){
    if(warnEl) warnEl.textContent = 'مدة التسجيل قصيرة جداً مقارنة بطول النص — يبدو أنك لم تُكمل قراءته. أعد المحاولة.';
    return;
  }
  if(totalDur > max){
    if(warnEl) warnEl.textContent = 'مدة التسجيل أطول بكثير من المتوقع لهذا النص — تأكد أنك سجّلت النص المطلوب فقط دون توقف طويل أو كلام إضافي.';
    return;
  }
  gReleaseMic();
  onRecordingPassed();
}

function examWidget(unitTitle, onPass, customQs){
  const qs = customQs || [

    {q:'ماذا تفعل إذا أخطأت أثناء الأداء المباشر؟', opts:['تتوقف نهائياً','تتابع بثقة وتصحح لاحقاً','تعتذر وتنهي التسجيل'], a:1}
  ];
  window.__examAnswers = {};

  qs.forEach((item,qi)=>{
    html += `<div class="card p-4 mb-3">
      <div class="font-700 text-sm mb-3">${qi+1}. ${item.q}</div>
      ${item.opts.map((o,oi)=>`

          class="w-full text-right ghostbtn rounded-xl px-3 py-2.5 mb-2 text-sm">${o}</button>`).join('')}
    </div>`;
  });
  html += `<button onclick="submitExam()" class="goldbtn w-full py-3 rounded-2xl disp font-800 mt-1">تسليم الامتحان</button>
    <div id="exam-result" class="text-center text-sm mt-3"></div>

}
function selectExamAnswer(qi,oi){
  window.__examAnswers[qi]=oi;
  window.__examData.qs.forEach((item,qqi)=>{
    item.opts.forEach((o,ooi)=>{
      const el=document.getElementById(`opt-${qqi}-${ooi}`);
      if(el) el.style.borderColor = (qqi===qi && ooi===oi) ? 'var(--gold)' : 'var(--line)';
    });
  });
}
function submitExam(){
  const {qs,onPass} = window.__examData;
  let correct=0;
  qs.forEach((item,qi)=>{ if(window.__examAnswers[qi]===item.a) correct++; });
  const passed = correct >= qs.length;
  document.getElementById('exam-result').innerHTML = passed
    ? `<span class="txt-gold disp font-800">نجحت! ${correct}/${qs.length} ✓ — الوحدة التالية مفتوحة الآن</span>`
    : `<span class="txt-rec disp font-800">${correct}/${qs.length} — أعد المحاولة لتتخطى الوحدة</span>`;
  if(passed){ addPoints(30); setTimeout(onPass, 900); }
}

let EDITOR = null;

function stopPlaybackLoop(){
  if(playbackAnimId) cancelAnimationFrame(playbackAnimId);
  playbackAnimId = null;
}
function startPlaybackLoop(){
  const e = EDITOR;
  let lastT = performance.now();
  function step(now){
    if(!e.playing){ playbackAnimId=null; return; }
    const dt = (now-lastT)/1000;
    lastT = now;
    e.playhead += dt;
    if(e.recording){
      const clip = e.tracks.user.clips.find(c=>c.id===e.recordingClipId);
      if(clip){
        clip.dur = +(e.playhead - clip.start).toFixed(3);
        const clipEl = document.getElementById(`clip-${clip.id}`);
        if(clipEl) clipEl.style.width = durToPct(clip.dur)+'%';
      }
    }
    if(e.playhead>=e.duration){
      e.playhead=e.duration; e.playing=false; eStopSources();
      if(e.recording) toggleRecord();
      renderInPlace();
      playbackAnimId=null;
      return;
    }
    if((e.zoom||1)>1){ const panned=ensureTimeVisible(e.playhead); if(panned){ repositionTimeline(); } }
    updatePlaybackUI();
    playbackAnimId = requestAnimationFrame(step);
  }
  playbackAnimId = requestAnimationFrame(step);
}

const FPS = 30;
function snapFrame(t){ return Math.round(t*FPS)/FPS; }
function windowDur(){ return EDITOR.duration/(EDITOR.zoom||1); }
function clampView(){
  const wd = windowDur();

  vs = Math.max(0, Math.min(Math.max(0,EDITOR.duration-wd), vs));
  EDITOR.viewStart = vs;
  return vs;
}
function centerView(){
  const wd = windowDur();

}
function ensureTimeVisible(t){
  const wd = windowDur();
  const margin = wd*0.1;

  if(t < EDITOR.viewStart+margin){ EDITOR.viewStart = t-margin; changed=true; }
  else if(t > EDITOR.viewStart+wd-margin){ EDITOR.viewStart = t-wd+margin; changed=true; }
  if(changed) clampView();

}
function zoomIn(){ EDITOR.zoom = Math.min(8,(EDITOR.zoom||1)*2); centerView(); renderInPlace(); }
function zoomOut(){ EDITOR.zoom = Math.max(1,(EDITOR.zoom||1)/2); centerView(); renderInPlace(); }

function durToPct(d){ return d/windowDur()*100; }
function fmtTime(t){ const m=Math.floor(t/60), s=Math.floor(t%60); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
