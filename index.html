/* توليد موجة صوتية شكلية ثابتة (deterministic) حسب seed */
function waveformHtml(seed, barCount){
  let h = 0; const bars=[];
  for(let i=0;i<barCount;i++){
    h = (h*9301+49297+seed*13+i*7) % 233280;
    const rnd = h/233280;
    const height = 20 + Math.round(rnd*70);
    bars.push(`<div class="wf-bar" style="height:${height}%"></div>`);
  }
  return `<div class="wf-clip">${bars.join('')}</div>`;
}
/* ===== موجة صوتية حقيقية (من الصوت المسجَّل) + موجة حيّة أثناء التسجيل ===== */
const WF_PER_SEC = 10;
const wfCache = new WeakMap();
function peaksFor(buf, off, dur){
  const n = Math.max(4, Math.min(600, Math.round(dur*WF_PER_SEC)));
  const key = 'r2|'+off.toFixed(3)+'|'+dur.toFixed(3)+'|'+n;
  let m = wfCache.get(buf); if(!m){ m = new Map(); wfCache.set(buf, m); }
  if(m.has(key)) return m.get(key);
  const data = buf.getChannelData(0), sr = buf.sampleRate;
  const s0 = Math.max(0, Math.floor(off*sr)), s1 = Math.min(data.length, Math.floor((off+dur)*sr));
  const span = Math.max(1, (s1-s0)/n), rms = new Array(n);
  for(let i=0;i<n;i++){
    const a = s0 + Math.floor(i*span), b = Math.min(s1, s0 + Math.floor((i+1)*span));
    const step = Math.max(1, Math.floor((b-a)/256));
    let sum = 0, c = 0;
    for(let j=a;j<b;j+=step){ const v = data[j]; sum += v*v; c++; }
    rms[i] = c ? Math.sqrt(sum/c) : 0;
  }
  const sorted = rms.slice().sort((x,y)=>x-y);
  const floor = sorted[Math.floor(n*0.15)] * 1.6;        // مستوى ضجيج الغرفة تقريباً
  const ceil = sorted[Math.min(n-1, Math.floor(n*0.95))];  // مستوى الكلام العالي
  const res = rms.map(v=> ceil>floor*1.2 ? Math.max(0, Math.min(1, (v-floor)/(ceil-floor))) : 0);
  m.set(key, res);
  return res;
}
function wfBarsHtml(vals, color){
  const bars = vals.map(v=>`<div style="flex:1 1 0;min-width:1px;border-radius:1px;background:${color};height:${(5+95*Math.min(1,Math.max(0,v))).toFixed(0)}%"></div>`).join('');
  return `<div dir="ltr" style="direction:ltr;position:absolute;inset:0;display:flex;flex-direction:row;align-items:center;gap:1px;padding:3px 2px;overflow:hidden;pointer-events:none">${bars}</div>`;
}
function clipWaveHtml(buf, off, dur, live, color, seed){
  if(buf){ try{ return wfBarsHtml(peaksFor(buf, off||0, dur), color); }catch(e){} }
  if(live && live.length) return wfBarsHtml(live.map(x=>Math.min(1,Math.max(0,(x-0.04)/0.4))), color);

}

function startSynced(src, now, delta, off, into, dur){
  let when = now + delta + SYNC_MS/1000, offset = off + into;
  if(when < now){ const skip = now - when; offset += skip; dur -= skip; when = now; }
  if(dur <= 0.01) return false;
  src.start(when, offset, dur);
  return true;
}
/* معايرة التزامن: مقارنة منحنى مستوى الصوت الحي مع منحنى الملف المسجَّل وإيجاد الإزاحة الأنسب (±0.6 ث) */
function envLive(samples, t0){
  const bin = 0.03, n = Math.ceil(((samples[samples.length-1].t - t0)/1000)/bin) + 1, out = new Float32Array(n);
  samples.forEach(s=>{ const i = Math.floor(((s.t - t0)/1000)/bin); if(i>=0 && i<n && s.v>out[i]) out[i] = s.v; });
  return {bin, env:out};
}
function envBuf(buf, bin){
  const d = buf.getChannelData(0), sr = buf.sampleRate, w = Math.max(1, Math.floor(sr*bin)), n = Math.floor(d.length/w), out = new Float32Array(n);
  for(let i=0;i<n;i++){ let p = 0; const a = i*w, st = Math.max(1, Math.floor(w/32)); for(let j=a;j<a+w;j+=st){ const v = Math.abs(d[j]); if(v>p) p = v; } out[i] = p; }

}
function centered(x){ let m = 0; for(let i=0;i<x.length;i++) m += x[i]; m /= (x.length||1); const o = new Float32Array(x.length); for(let i=0;i<x.length;i++) o[i] = x[i]-m; return o; }
function calibrateDelta(buf, samples, t0){
  try{
    if(!samples || samples.length < 10) return 0;
    const L = envLive(samples, t0), bin = L.bin;
    const l = centered(L.env), bb = centered(envBuf(buf, bin));
    let mxL = 0, mxB = 0; l.forEach(v=>{ if(Math.abs(v)>mxL) mxL = Math.abs(v); }); bb.forEach(v=>{ if(Math.abs(v)>mxB) mxB = Math.abs(v); });
    if(mxL < 0.05 || mxB < 0.01) return 0;               // لا يوجد صوت واضح للمقارنة
    const maxLag = Math.round(0.6/bin);
    const score = lag=>{
      let s = 0, e1 = 0, e2 = 0;
      for(let i=0;i<l.length;i++){ const j = i - lag; if(j<0 || j>=bb.length) continue; s += l[i]*bb[j]; e1 += l[i]*l[i]; e2 += bb[j]*bb[j]; }
      return (e1>0 && e2>0) ? s/Math.sqrt(e1*e2) : -1;
    };
    const s0 = score(0); let best = 0, bs = s0;
    for(let lag=-maxLag; lag<=maxLag; lag++){ const sc = score(lag); if(sc > bs){ bs = sc; best = lag; } }
    if(best===0 || bs < 0.5 || bs < s0 + 0.12) return 0; // لا نُزيح إلا إذا كان التحسّن واضحاً
    const d = best*bin;

}
/* مقياس مستوى الصوت الحي من الميكروفون */
function meterStart(stream){
  try{
    const ctx = gGetCtx();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser(); an.fftSize = 1024;
    src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    const m = {max:0, timer:null, samples:[]};
    m.timer = setInterval(()=>{
      an.getByteTimeDomainData(buf);
      let pk = 0; for(let i=0;i<buf.length;i++){ const v = Math.abs(buf[i]-128)/128; if(v>pk) pk = v; }
      if(pk>m.max) m.max = pk;
      m.samples.push({t:performance.now(), v:pk});
      if(m.samples.length>4000) m.samples.splice(0,1000);
    }, 30);
    m.take = ()=>{ const v = m.max; m.max = 0; return v; };
    m.stop = ()=>{ clearInterval(m.timer); try{ src.disconnect(); }catch(e){} };
    return m;
  }catch(e){ return null; }
}

function renderRuler(){
  let html = `<div class="tl-ruler" onpointerdown="seekAt(event)" style="cursor:pointer">`;
  for(let t=0;t<=EDITOR.duration;t+=2){ html += `<span class="tl-tick" data-t="${t}" style="left:${timeToPct(t)}%">${t}s</span>`; }
  html += `</div>`;
  return html;
}
function seekAt(ev){
  if(EDITOR.playing) togglePlay();
  const wrap = ev.currentTarget.closest('.relative');
  const rect = wrap.getBoundingClientRect();
  const pct = (ev.clientX - rect.left) / rect.width;
  const vs = clampView(); const wd = windowDur();
  EDITOR.playhead = snapFrame(Math.max(0, Math.min(EDITOR.duration, vs + pct*wd)));
  renderInPlace();
}
let scrubState = null;
function scrubStart(ev){
  ev.preventDefault(); ev.stopPropagation();
  if(EDITOR.playing) togglePlay();
  const wrap = ev.currentTarget.closest('.relative');
  scrubState = {rect: wrap.getBoundingClientRect()};
  document.onpointermove = scrubMove;
  document.onpointerup = scrubEnd;
}
function scrubMove(ev){
  if(!scrubState) return;
  const pct = (ev.clientX - scrubState.rect.left) / scrubState.rect.width;
  const vs = clampView(); const wd = windowDur();
  EDITOR.playhead = Math.max(0, Math.min(EDITOR.duration, vs + pct*wd));
  if((EDITOR.zoom||1)>1){ ensureTimeVisible(EDITOR.playhead); repositionTimeline(); }
  updatePlaybackUI();
}
function scrubEnd(){
  document.onpointermove = null; document.onpointerup = null;
  if(scrubState){ EDITOR.playhead = snapFrame(EDITOR.playhead); renderInPlace(); }
  scrubState = null;
}
let videoScrubState = null;
function videoScrubStart(ev){
  ev.preventDefault(); ev.stopPropagation();
  if(EDITOR.playing) togglePlay();
  const wrap = document.getElementById('video-bar-wrap');
  videoScrubState = {rect: wrap.getBoundingClientRect()};
  document.onpointermove = videoScrubMove;
  document.onpointerup = videoScrubEnd;
}
function videoScrubMove(ev){
  if(!videoScrubState) return;
  const pct = (ev.clientX - videoScrubState.rect.left) / videoScrubState.rect.width;
  EDITOR.playhead = Math.max(0, Math.min(EDITOR.duration, pct*EDITOR.duration));
  updatePlaybackUI();
}
function videoScrubEnd(){
  document.onpointermove = null; document.onpointerup = null;
  if(videoScrubState){ EDITOR.playhead = snapFrame(EDITOR.playhead); renderInPlace(); }
  videoScrubState = null;
}
function resetPlayhead(){
  if(EDITOR.playing) togglePlay();
  EDITOR.playhead = 0;
  if((EDITOR.zoom||1)>1) centerView();
  renderInPlace();
}
function stopPlayback(){
  const e = EDITOR;
  if(e.preRoll){ e.preRoll = null; e.preRollTarget = null; eReleaseMic(); if(e.playing) togglePlay(); render(); return; }
  if(e.recording) toggleRecord();
  if(e.playing) togglePlay();
}
let skipAnimId = null;
function skipTime(delta){
  if(EDITOR.playing) togglePlay();
  if(skipAnimId) cancelAnimationFrame(skipAnimId);
  const startVal = EDITOR.playhead;
  const endVal = Math.max(0, Math.min(EDITOR.duration, startVal+delta));
  const dur = 260;
  const t0 = performance.now();
  function step(now){
    const p = Math.min(1, (now-t0)/dur);
    const eased = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
    EDITOR.playhead = startVal + (endVal-startVal)*eased;
    if((EDITOR.zoom||1)>1){ ensureTimeVisible(EDITOR.playhead); repositionTimeline(); }
    updatePlaybackUI();
    if(p<1){ skipAnimId = requestAnimationFrame(step); }
    else {
      EDITOR.playhead = snapFrame(endVal);
      if((EDITOR.zoom||1)>1) centerView();
      renderInPlace();
    }
  }
  skipAnimId = requestAnimationFrame(step);
}

function nudgeClip(dir){
  const clip = EDITOR.tracks.user.clips.find(c=>c.id===EDITOR.selectedClip);
  if(!clip) return;
  pushHistory();
  let newStart = clip.start + dir*(1/FPS);
  const {min, max} = clipAllowedRange(clip.id, clip.dur, clip.start);
  newStart = Math.max(min, Math.min(max, newStart));
  clip.start = snapFrame(newStart);
  if((EDITOR.zoom||1)>1) ensureTimeVisible(clip.start);
  renderInPlace();
  const t = document.getElementById('move-clip-time');
  if(t) t.innerHTML = clip.start.toFixed(3)+'ث<br><span style="font-size:8px">فريم '+Math.round(clip.start*FPS)+'</span>';
}

function eScheduleUserAudio(){
  eStopSources();

  const anySolo = Object.values(e.tracks).some(t=>t.solo);
  const now = ctx.currentTime + 0.05;
  Object.keys(e.tracks).forEach(key=>{
    const tr = e.tracks[key];
    if(tr.muted || (anySolo && !tr.solo)) return;
    if(key==='user' && e.recording) return;      // لا نُعيد صوتك أثناء تسجيله
    const gain = ctx.createGain();
    gain.gain.value = (tr.vol==null ? 100 : tr.vol)/100;
    gain.connect(ctx.destination);
    tr.clips.forEach(c=>{

      if(!buf) return;
      if(e.playhead >= c.start + c.dur) return;
      const into = Math.max(0, e.playhead - c.start);

function eFinishRecording(){
  const m = EREC; EREC = null;
  if(!m || !m.rec){ return; }
  clearInterval(m.timer); if(m.meter) m.meter.stop();
  const e = EDITOR, clipId = m.clipId, bid = m.bid;
  m.rec.onstop = async ()=>{
    try{ m.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
    const clip = e && e.tracks.user.clips.find(c=>c.id===clipId);
    try{
      const blob = new Blob(m.chunks, {type:(m.chunks[0]&&m.chunks[0].type)||'audio/webm'});
      if(!blob.size) throw new Error('empty');
      const ctx = gGetCtx();
      const arr = await blob.arrayBuffer();
      EBUF[bid] = await new Promise((res,rej)=>ctx.decodeAudioData(arr,res,rej));
      if(clip){
        clip.bid = bid; clip.off = 0; clip.dur = +Math.min(clip.dur, EBUF[bid].duration).toFixed(3) || clip.dur;
        const dl = calibrateDelta(EBUF[bid], m.meter && m.meter.samples, m.t0);
        if(dl){
          let ns = clip.start + dl, off = 0;
          if(ns < 0){ off = -ns; ns = 0; }
          clip.start = +ns.toFixed(3); clip.off = +off.toFixed(3);
          clip.dur = +Math.max(0.1, Math.min(clip.dur - off, EBUF[bid].duration - off, e.duration - ns)).toFixed(3);
        }
        delete clip.live;
      }
    }catch(err){
      if(e) e.tracks.user.clips = e.tracks.user.clips.filter(c=>c.id!==clipId);
      eShowError('لم يُلتقط أي صوت من الميكروفون. تأكد من الإذن وأعد التسجيل.');

}
async function toggleRecord(){

    e.preRoll = Math.max(1, Math.ceil(toT - e.playhead));

function projectFromGRec(title){

}
function voicePeak(voice){
  let pk = 0;
  voice.clips.forEach(c=>{
    const d = c.buf.getChannelData(0), sr = c.buf.sampleRate;
    const a = Math.floor(c.off*sr), b = Math.min(d.length, Math.floor((c.off+c.dur)*sr));
    const step = Math.max(1, Math.floor((b-a)/200000));
    for(let i=a;i<b;i+=step){ const v = Math.abs(d[i]); if(v>pk) pk = v; }
  });
  return pk;
}
/* يجدول الطبقات على أي AudioContext (حقيقي أو Offline) باتجاه عقدة الخرج dest */
function scheduleMix(ctx, dest, proj, layers, opts, t0){
  const srcs = [];
  const limiter = ctx.createDynamicsCompressor();
  limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.003; limiter.release.value = 0.1;
  limiter.connect(dest);
  const chain = (vol, hp)=>{
    const g = ctx.createGain(); g.gain.value = vol; g.connect(limiter);
    if(!hp) return g;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp; f.connect(g); return f;
  };
  const play = (tr, head)=>{
    tr.clips.forEach(c=>{
      if(!c.buf || c.dur <= 0.01) return;
      const s = ctx.createBufferSource(); s.buffer = c.buf; s.connect(head);
      s.start(t0 + c.start, c.off||0, c.dur); srcs.push(s);
    });
  };
  if(layers.voice && proj.voice && proj.voice.clips.length){
    const pk = opts.normalize ? voicePeak(proj.voice) : 0;
    const norm = (opts.normalize && pk > 0.005) ? Math.min(8, 0.89/pk) : 1;
    play(proj.voice, chain((proj.voice.vol==null?100:proj.voice.vol)/100*norm, opts.clean ? 90 : 0));
  }
  if(layers.partner && proj.partner) play(proj.partner, chain((proj.partner.vol==null?100:proj.partner.vol)/100, 0));
  if(layers.orig && proj.orig) play(proj.orig, chain((proj.orig.vol==null?80:proj.orig.vol)/100, 0));
  if(layers.bed && proj.bed) play(proj.bed, chain((proj.bed.vol==null?80:proj.bed.vol)/100, 0));
  return srcs;
}
async function renderMixBuffer(proj, layers, opts){
  const sr = 44100, OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const ctx = new OAC(2, Math.ceil(proj.duration*sr), sr);
  scheduleMix(ctx, ctx.destination, proj, layers, opts || {}, 0);
  return await new Promise((res,rej)=>{
    const r = ctx.startRendering();
    if(r && r.then) r.then(res, rej); else ctx.oncomplete = ev=>res(ev.renderedBuffer);
  });
}
function encodeWav(buf){
  const ch = Math.min(2, buf.numberOfChannels), n = buf.length, sr = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + n*ch*2));
  const wr = (o,s)=>{ for(let i=0;i<s.length;i++) out.setUint8(o+i, s.charCodeAt(i)); };
  wr(0,'RIFF'); out.setUint32(4, 36+n*ch*2, true); wr(8,'WAVE'); wr(12,'fmt ');
  out.setUint32(16,16,true); out.setUint16(20,1,true); out.setUint16(22,ch,true);
  out.setUint32(24,sr,true); out.setUint32(28,sr*ch*2,true); out.setUint16(32,ch*2,true); out.setUint16(34,16,true);
  wr(36,'data'); out.setUint32(40, n*ch*2, true);
  const chans = []; for(let c=0;c<ch;c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for(let i=0;i<n;i++) for(let c=0;c<ch;c++){
    const v = Math.max(-1, Math.min(1, chans[c][i]));
    out.setInt16(o, v<0 ? v*0x8000 : v*0x7FFF, true); o += 2;
  }
  return new Blob([out.buffer], {type:'audio/wav'});
}
function pickVideoMime(){
  const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const m of list){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
  return '';
}
let LOGO_IMG = null;

/* العلامة المائية: إلزامية على كل فيديو يُصدَّر */
function drawWatermark(g, W, H){
  const fam = "'Cairo','Tajawal',sans-serif";
  const pad = Math.round(W*0.022), fs = Math.round(W*0.026);
  const logo = getLogoImg(), ls = Math.round(W*0.045);
  g.save();
  g.globalAlpha = 0.82;
  g.direction = 'rtl'; g.textAlign = 'right'; g.textBaseline = 'middle';
  const t1 = '🎙 ' + WATERMARK_TITLE, t2 = '@' + myName();
  g.font = `800 ${fs}px ${fam}`;
  const w1 = g.measureText(t1).width;
  g.font = `600 ${Math.round(fs*0.8)}px ${fam}`;
  const w2 = g.measureText(t2).width;
  const bw = Math.max(w1, w2) + ls + pad*2.2, bh = ls + pad*0.9;
  const x = W - pad - bw, y = pad;
  g.fillStyle = 'rgba(8,6,14,.55)';
  g.beginPath(); if(g.roundRect) g.roundRect(x, y, bw, bh, bh*0.28); else g.rect(x, y, bw, bh); g.fill();
  try{ if(logo.complete && logo.naturalWidth) g.drawImage(logo, x+pad*0.6, y+(bh-ls)/2, ls, ls); }catch(e){}
  g.fillStyle = '#ffffff'; g.font = `800 ${fs}px ${fam}`;
  g.fillText(t1, x+bw-pad*0.7, y+bh*0.36);
  g.fillStyle = '#ffb27a'; g.font = `600 ${Math.round(fs*0.8)}px ${fam}`;
  g.fillText(t2, x+bw-pad*0.7, y+bh*0.7);
  g.restore();
}
function drawCardFrame(g, W, H, proj, an, freq, prog){
  const grd = g.createRadialGradient(W/2, H*0.38, 20, W/2, H/2, H*0.9);
  grd.addColorStop(0, '#3a2d52'); grd.addColorStop(1, '#0c0913');
  g.fillStyle = grd; g.fillRect(0,0,W,H);
  const fam = "'Cairo','Tajawal',sans-serif";
  const logo = getLogoImg();
  try{ if(logo.complete && logo.naturalWidth){ const s = H*0.2; g.drawImage(logo, W/2-s/2, H*0.1, s, s); } }catch(e){}
  g.textAlign = 'center'; g.direction = 'rtl'; g.textBaseline = 'middle';
  g.fillStyle = '#ffffff'; g.font = `800 ${Math.round(H*0.075)}px ${fam}`;
  g.fillText(proj.title, W/2, H*0.38);
  g.fillStyle = '#ffb27a'; g.font = `600 ${Math.round(H*0.04)}px ${fam}`;
  g.fillText(myName(), W/2, H*0.46);
  if(an){
    an.getByteFrequencyData(freq);
    const bars = 48, bw = W*0.62/bars, base = H*0.74, mh = H*0.2;
    for(let i=0;i<bars;i++){
      const v = freq[Math.floor(i*freq.length*0.5/bars)]/255;
      const bh = Math.max(4, v*mh);
      g.fillStyle = `rgba(255,${110+Math.round(v*80)},40,${0.55+v*0.45})`;
      g.fillRect(W*0.19 + i*bw, base - bh/2, bw*0.62, bh);
    }
  }
  g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(W*0.19, H*0.9, W*0.62, 6);
  g.fillStyle = '#FF5500'; g.fillRect(W*0.19, H*0.9, W*0.62*Math.max(0,Math.min(1,prog)), 6);
}
/* فيديو حقيقي: لقطات الفيديو (أو بطاقة صوتية) + مزج الصوت، بعلامة مائية دائماً */
async function renderVideoBlob(proj, layers, opts, onProgress){
  if(typeof MediaRecorder==='undefined' || !HTMLCanvasElement.prototype.captureStream) throw new Error('متصفحك لا يدعم تصدير الفيديو. جرّب Chrome حديث.');
  const W = 1280, H = 720, canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const actx = gGetCtx(); try{ await actx.resume(); }catch(e){}
  const dest = actx.createMediaStreamDestination();
  const bus = actx.createGain(); bus.connect(dest);
  const an = actx.createAnalyser(); an.fftSize = 512; bus.connect(an);
  const freq = new Uint8Array(an.frequencyBinCount);
  let vid = null;
  if(layers.video && proj.videoUrl){
    vid = document.createElement('video'); vid.muted = true; vid.playsInline = true; vid.preload = 'auto'; vid.src = proj.videoUrl;
    await new Promise((res,rej)=>{ vid.onloadeddata = res; vid.onerror = ()=>rej(new Error('تعذّر قراءة ملف الفيديو في هذا المتصفح (صيغة غير مدعومة أو الملف غير موجود). جرّب Chrome، أو اجعل الفيديو MP4 بترميز H.264.')); });
  }
  try{ await getLogoImg().decode(); }catch(e){}
  const stream = canvas.captureStream(30);
  dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  const mime = pickVideoMime();
  const rec = mime ? new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:4000000}) : new MediaRecorder(stream);
  const chunks = []; rec.ondataavailable = ev=>{ if(ev.data && ev.data.size>0) chunks.push(ev.data); };
  const done = new Promise(res=>{ rec.onstop = res; });
  const dur = proj.duration;
  const t0 = actx.currentTime + 0.12;
  const srcs = scheduleMix(actx, bus, proj, layers, opts || {}, t0);
  if(vid){ vid.currentTime = 0; try{ await vid.play(); }catch(e){} }
  rec.start(500);
  let stopped = false;
  const finish = ()=>{
    if(stopped) return; stopped = true;
    srcs.forEach(s=>{ try{ s.stop(); }catch(e){} });
    if(vid){ try{ vid.pause(); }catch(e){} }
    try{ rec.stop(); }catch(e){}
  };
  await new Promise(resolve=>{
    const tick = ()=>{
      const el = Math.max(0, actx.currentTime - t0);
      if(vid){
        g.fillStyle = '#000'; g.fillRect(0,0,W,H);
        const vw = vid.videoWidth||W, vh = vid.videoHeight||H, s = Math.min(W/vw, H/vh);
        try{ g.drawImage(vid, (W-vw*s)/2, (H-vh*s)/2, vw*s, vh*s); }catch(e){}
      } else drawCardFrame(g, W, H, proj, an, freq, el/dur);
      drawWatermark(g, W, H);
      if(onProgress) onProgress(Math.min(1, el/dur));
      if(el >= dur + 0.15){ finish(); resolve(); return; }
      requestAnimationFrame(tick);
    };
    tick();
    // أمان: إذا أُوقفت الإطارات (تبويب مخفي) ننتهي بالمؤقّت
    setTimeout(()=>{ finish(); resolve(); }, (dur+3)*1000 + 2000);
  });
  await done;
  try{ bus.disconnect(); }catch(e){}
  const type = (chunks[0] && chunks[0].type) || mime || 'video/webm';
  return {blob:new Blob(chunks, {type}), ext: /mp4/.test(type) ? 'mp4' : 'webm', type};
}
function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ try{ a.remove(); URL.revokeObjectURL(url); }catch(e){} }, 4000);
}
function exportFileName(proj, layers, ext){
  const parts = []; if(layers.video) parts.push('video'); if(layers.orig) parts.push('orig'); if(layers.partner) parts.push('partner'); if(layers.bed) parts.push('music'); if(layers.voice) parts.push('voice');
  const d = new Date(), z = n=>String(n).padStart(2,'0');
  return `sada${proj.unit?('-u'+z(proj.unit)):''}-${parts.join('+')||'mix'}-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.${ext}`;
}
/* نقطة الدخول: ينتج {blob,name,type,kind} حسب الطبقات المختارة */
async function exportProject(proj, layers, opts, onProgress){
  if(layers.video){
    const r = await renderVideoBlob(proj, layers, opts, onProgress);
    return {blob:r.blob, name:exportFileName(proj, layers, r.ext), type:r.type, kind:'video', cardMode:!proj.videoUrl};
  }
  if(onProgress) onProgress(0.2);
  const buf = await renderMixBuffer(proj, layers, opts);
  if(onProgress) onProgress(0.9);
  const blob = encodeWav(buf);
  return {blob, name:exportFileName(proj, layers, 'wav'), type:'audio/wav', kind:'audio'};
}

let _idb = null;
function idb(){
  if(_idb) return _idb;
  _idb = new Promise((res,rej)=>{
    const r = indexedDB.open('sada-media', 1);
    r.onupgradeneeded = ()=>{ r.result.createObjectStore('files', {keyPath:'id'}); };
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
  return _idb;
}
async function idbTx(mode, fn){
  const d = await idb();
  return new Promise((res,rej)=>{
    const tx = d.transaction('files', mode), st = tx.objectStore('files');
    const rq = fn(st);
    tx.oncomplete = ()=>res(rq ? rq.result : undefined); tx.onerror = ()=>rej(tx.error); tx.onabort = ()=>rej(tx.error);
  });
}
const MEDIA_URLS = {};
async function libSave(blob, meta){
  const item = Object.assign({id:'m'+Date.now()+Math.random().toString(36).slice(2,7), owner:myId(), created:Date.now(), size:blob.size, blob}, meta);
  await idbTx('readwrite', st=>st.put(item));
  return item.id;
}
async function libGet(id){ return idbTx('readonly', st=>st.get(id)); }
async function libList(){
  const all = (await idbTx('readonly', st=>st.getAll())) || [];
  return all.filter(it=>it.owner===myId()).sort((a,b)=>b.created-a.created);
}
async function libDelete(id){
  const it = await libGet(id);
  if(!it || it.owner!==myId()) return false;
  await idbTx('readwrite', st=>st.delete(id));
  if(MEDIA_URLS[id]){ try{ URL.revokeObjectURL(MEDIA_URLS[id]); }catch(e){} delete MEDIA_URLS[id]; }
  return true;
}
async function mediaUrl(id){
  if(MEDIA_URLS[id]) return MEDIA_URLS[id];
  const it = await libGet(id); if(!it) return null;
  return (MEDIA_URLS[id] = URL.createObjectURL(it.blob));
}
function hydrateMedia(){
  document.querySelectorAll('[data-mid]').forEach(async el=>{
    if(el.dataset.done) return; el.dataset.done = '1';
    let u = null; try{ u = await mediaUrl(el.dataset.mid); }catch(e){}
    if(u) el.src = u;
    else { try{ el.outerHTML = '<div class="text-[11px] txt-muted py-2">المرفق غير متاح على هذا الجهاز</div>'; }catch(e){} }
  });
}
const MAX_UPLOAD = 200*1024*1024;
function slotLabel(slot){
  if(slot==='rec') return 'تسجيل عادي';
  if(slot==='challenge') return 'تحدٍّ للمجتمع';
  if(slot && slot.startsWith('dub:')){ const u = PERFORMANCE_UNITS[+slot.slice(4)-1]; return 'دبلجة — '+(u?u.t:slot); }
  return 'أخرى';
}
function mediaKindOf(file){
  if(/^video\//.test(file.type)) return 'video';
  if(/^audio\//.test(file.type)) return 'audio';
  const n = (file.name||'').toLowerCase();
  if(/\.(mp4|mov|webm|m4v)$/.test(n)) return 'video';
  if(/\.(mp3|wav|m4a|aac|ogg|webm)$/.test(n)) return 'audio';
  return null;
}

function arabicToNum(s){
  const map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return parseInt(s.split('').map(c=>map[c]||c).join(''),10);
}
function generalDurationSeconds(title){
  const m = title.match(/\(([٠-٩]+)/);
  const n = m ? arabicToNum(m[1]) : 3;
  return (n||3)*60;
}
function fmtMinSec(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), sec=s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }

let genSession = null, genTimerInterval = null, genRecInterval = null, genProgress = {};
function toggleGeneralOpen(i){
  clearInterval(genTimerInterval); clearInterval(genRecInterval);
  if(STATE.general.open===i){
    if(genSession) genProgress[i] = {phase:genSession.phase, elapsed:genSession.elapsed, duration:genSession.duration, recSeconds:0, recording:false};
    STATE.general.open=null; genSession=null; render(); return;
  }
  STATE.general.open = i;
  const done = STATE.general.done[i];
  if(!done){
    const saved = genProgress[i];
    const dur = generalDurationSeconds(GENERAL_UNITS[i].t);
    genSession = saved ? {i, phase:saved.phase, elapsed:saved.elapsed, duration:saved.duration||dur, recSeconds:0, recording:false} : {i, phase:'timer', elapsed:0, duration:dur, recSeconds:0, recording:false};
  } else { genSession = null; }
  render();
  if(genSession && genSession.phase==='timer') startGenTimer();
}
function startGenTimer(){
  clearInterval(genTimerInterval);
  genTimerInterval = setInterval(()=>{
    if(!genSession || genSession.phase!=='timer'){ clearInterval(genTimerInterval); return; }
    genSession.elapsed++;
    genProgress[genSession.i] = {phase:'timer', elapsed:genSession.elapsed, duration:genSession.duration};
    const bar = document.getElementById('gen-timer-bar');
    const txt = document.getElementById('gen-timer-text');
    if(bar) bar.style.width = Math.min(100, genSession.elapsed/genSession.duration*100)+'%';
    if(txt) txt.textContent = fmtMinSec(genSession.duration-genSession.elapsed);
    if(genSession.elapsed>=genSession.duration){
      clearInterval(genTimerInterval);
      genSession.phase='record';
      genProgress[genSession.i] = {phase:'record', elapsed:genSession.elapsed, duration:genSession.duration};
      render();
    }
  },1000);
}
async function startGenRecording(){
  const res = await beginLiveRecording();
  if(!res.ok){
    genSession.micError = res.error;
    render();
    return;
  }
  genSession.micError = null;
  genSession.recording = true; genSession.recSeconds = 0; genSession.recordedUrl = null;
  render();
  genRecInterval = setInterval(()=>{
    genSession.recSeconds++;
    const t = document.getElementById('gen-rec-time');
    if(t) t.textContent = genSession.recSeconds+'ث';
  },1000);
}
async function stopGenRecording(){
  clearInterval(genRecInterval);
  genSession.recording = false;
  render();
  const {seconds, url} = await endLiveRecording();
  genSession.recSeconds = Math.round(seconds);
  genSession.recordedUrl = (seconds>=5 && url) ? url : null;
  render();
}
function confirmGenDone(){
  const i = genSession.i;
  STATE.general.done[i]=true;
  delete genProgress[i];
  addPoints(10);
  genSession.phase='done';
  saveState(); render();
}

let COMPOSER_MEDIA = '';
async function addPost(){
  const el = document.getElementById('new-post');
  if(!el.value.trim() && !COMPOSER_MEDIA) return;
  const post = {id:Date.now(), author: myName(), ownerId: myId(), text:el.value.trim() || 'شارك تسجيلاً جديداً', likes:0, comments:[]};
  if(COMPOSER_MEDIA){

  const p=COMMUNITY_POSTS.find(p=>p.id===id);

function addComment(id){
  const el=document.getElementById(`c-${id}`); if(!el.value.trim()) return;

function weekCalendar(){
  const log = STATE.streak.log||[];
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    days.push({label:['أحد','إثن','ثلا','أرب','خمي','جمع','سبت'][d.getDay()], active:log.includes(key)});
  }
  return `<div class="flex items-center justify-between gap-1.5">
    ${days.map(d=>`<div class="flex flex-col items-center gap-1 flex-1">
      <div class="w-8 h-8 rounded-full icon-btn ${d.active?'neu-gold neu-glow-gold neu':'neu-locked neu'}">${d.active?ICONS.flame:''}</div>
      <span class="text-[9px] txt-muted">${d.label}</span>
    </div>`).join('')}
  </div>`;
}
function radarChart(secs){
  const cx=90, cy=90, r=65;
  const angle = (i)=> -Math.PI/2 + i*(Math.PI*2/secs.length);
  const pt = (i,val)=>{ const a=angle(i); const rr = r*(val/100); return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; };
  const axisPt = (i)=>{ const a=angle(i); return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const poly = secs.map((s,i)=>pt(i,s.pct).join(',')).join(' ');
  const rings = [0.33,0.66,1].map(f=>secs.map((s,i)=>{ const a=angle(i); return [cx+r*f*Math.cos(a), cy+r*f*Math.sin(a)].join(','); }).join(' '));
  return `<svg viewBox="0 0 180 180" class="mx-auto" style="max-width:220px">
    ${rings.map(p=>`<polygon points="${p}" fill="none" stroke="var(--line)" stroke-width="1"/>`).join('')}
    ${secs.map((s,i)=>{ const [x,y]=axisPt(i); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`; }).join('')}
    <polygon points="${poly}" fill="rgba(255,85,0,.28)" stroke="var(--gold)" stroke-width="2"/>
    ${secs.map((s,i)=>{ const [x,y]=pt(i,s.pct); return `<circle cx="${x}" cy="${y}" r="2.6" fill="var(--gold)"/>`; }).join('')}
    ${secs.map((s,i)=>{ const [x,y]=axisPt(i); const a=angle(i); const lx=cx+(r+16)*Math.cos(a), ly=cy+(r+16)*Math.sin(a); return `<text x="${lx}" y="${ly}" fill="var(--muted)" font-size="8" text-anchor="middle" dominant-baseline="middle">${s.short}</text>`; }).join('')}
  </svg>`;
}

  return BADGES.filter(b=>
    (b.type==='points' && STATE.points>=b.threshold) ||
    (b.type==='streak' && STATE.streak.count>=b.threshold) ||
    (b.type==='community' && STATE.communityActions>=b.threshold)
  );
}
function checkNewBadges(){
  const earned = earnedBadgeList().map(b=>b.id);
  const fresh = earned.find(id=>!STATE.badges.includes(id));
  STATE.badges = earned;
  if(fresh){ STATE.newBadge = BADGES.find(b=>b.id===fresh); }
}
function addPoints(n){ STATE.points += n; checkNewBadges(); saveState(); }
function addCommunityAction(n){ STATE.communityActions += n; checkNewBadges(); }
function touchStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(!STATE.streak.log) STATE.streak.log = [];
  if(STATE.streak.last===today) return;
  if(STATE.streak.last){
    const diffDays = Math.round((new Date(today) - new Date(STATE.streak.last)) / 86400000);
    STATE.streak.count = diffDays===1 ? STATE.streak.count+1 : 1;
  } else { STATE.streak.count = 1; }
  STATE.streak.last = today;
  STATE.streak.log.push(today);
  if(STATE.streak.log.length>14) STATE.streak.log = STATE.streak.log.slice(-14);
  checkNewBadges(); saveState();
}

let searchQuery = '';
function searchAllUnits(q){
  q = (q||'').trim();
  if(!q) return [];
  const results = [];
  GRAMMAR_UNITS.forEach((u,i)=>{ if(u.t.includes(q)||u.d.includes(q)) results.push({section:'grammar', label:'قواعد النطق واللغة', title:u.t, idx:i}); });
  PERFORMANCE_UNITS.forEach((u,i)=>{ if(u.t.includes(q)||u.d.includes(q)) results.push({section:'performance', label:'أنواع الأداءات', title:u.t, idx:i}); });
  GENERAL_UNITS.forEach((u,i)=>{ if(u.t.includes(q)||u.d.includes(q)) results.push({section:'general', label:'تمارين عامة', title:u.t, idx:i}); });
  for(let d=1; d<=6; d++){
    dayExercises(d).forEach((ex,i)=>{ if(ex.title.includes(q)||ex.desc.includes(q)) results.push({section:'breathing', label:`التنفس — اليوم ${d}`, title:ex.title, idx:i, day:d}); });
  }
  return results;
}
const SEARCH_ICONS = {grammar:'book', performance:'spotlight', general:'target', breathing:'wind'};
function onSearchInput(v){ searchQuery=v; const el=document.getElementById('search-results'); if(el) el.innerHTML = renderSearchResults(); }
function goToSearchResult(r){
  if(r.section==='grammar'){ STATE.grammar.unlocked = Math.max(STATE.grammar.unlocked, r.idx+1); openGrammarUnit(r.idx); }
  else if(r.section==='performance'){ STATE.performance.unlocked = Math.max(STATE.performance.unlocked, r.idx+1); openPerfUnit(r.idx); }
  else if(r.section==='general'){ go('general'); toggleGeneralOpen(r.idx); }
  else if(r.section==='breathing'){ STATE.breathing.day = Math.max(STATE.breathing.day, r.day); go('breathing'); toggleExercisePlayer(r.day, r.idx); }
}
function renderSearchResults(){
  const results = searchAllUnits(searchQuery);
  if(!searchQuery.trim()) return `<div class="text-center text-sm txt-muted py-8">اكتب كلمة للبحث بكل وحدات التطبيق</div>`;
  if(!results.length) return `<div class="text-center text-sm txt-muted py-8">ما في نتائج لـ "${searchQuery}"</div>`;
  return results.map((r,i)=>`
    <button onclick='goToSearchResult(${JSON.stringify(r).replace(/'/g,"&#39;")})' class="card p-3.5 flex items-center gap-3 w-full text-right mb-2.5">
      <span class="icon-btn icon-sm txt-gold shrink-0">${ICONS[SEARCH_ICONS[r.section]]}</span>

        <div class="text-sm font-700">${r.title}</div>
        <div class="text-[10px] txt-muted mt-0.5">${r.label}</div>
      </div>
    </button>`).join('');
}
